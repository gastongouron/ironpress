<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border-radius four values</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 140px;
    background-color: #6a1b9a;
    border-radius: 10px 25px 40px 55px;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
