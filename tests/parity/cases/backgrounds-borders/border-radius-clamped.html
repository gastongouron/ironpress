<title>border-radius overlap clamping</title>

  html, body { background: #ffffff; }
  .box {
    width: 160px;
    height: 100px;
    background-color: #2e7d32;
    border-radius: 120px;
  }
</style>
</head>

  <div class="box"></div>
</body>
</html>
