<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>box-shadow elliptical radius</title>
<style>
  @page { size: 260px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage {
    width: 260px;
    height: 130px;
    padding: 15px 50px 35px 15px;
    background: #ffffff;
  }
  .pill {
    width: 180px;
    height: 80px;
    border-radius: 50%;
    background: #26a69a;
    box-shadow: 34px 20px 0 #6a1b9a;
  }
</style>
</head>
<body>
  <div class="stage"><div class="pill"></div></div>
</body>
</html>
