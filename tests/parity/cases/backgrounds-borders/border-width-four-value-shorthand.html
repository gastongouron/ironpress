<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border width four value shorthand</title>
<style>
  @page { size: 190px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 130px;
    height: 90px;
    margin: 20px;
    border-style: solid;
    border-color: #111111;
    border-width: 4px 12px 20px 28px;
    background: #fdd835;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
