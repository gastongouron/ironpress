<title>background image nonuniform radius clip</title>
<style>
  @page { size: 220px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }

  .box {
    width: 170px;
    height: 100px;

</head>
<body>
