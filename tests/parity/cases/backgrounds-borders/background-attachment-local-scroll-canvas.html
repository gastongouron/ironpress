<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background attachment local scroll canvas</title>
<style>
  @page { size: 180px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 120px;
    height: 80px;
    margin: 20px;
    overflow: auto;
    background-image: linear-gradient(#e53935, #e53935);
    background-size: 120px 30px;
    background-repeat: no-repeat;
    background-position: left bottom;
    background-attachment: local;
    scrollbar-width: none;
    border: 4px solid #111111;
  }
  .box::-webkit-scrollbar {
    width: 0;
    height: 0;
  }
  .inner {
    height: 180px;
  }
</style>
</head>
<body>
  <div class="box"><div class="inner"></div></div>
</body>
</html>
