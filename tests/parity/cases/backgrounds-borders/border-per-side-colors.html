<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border per-side widths and colors</title>
<style>
  @page { size: 278px 121px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 120px;
    background-color: #fafafa;
    border-top: 4px solid #d50000;
    border-right: 8px solid #00c853;
    border-bottom: 12px solid #2962ff;
    border-left: 16px solid #ff6d00;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
