<html lang="en">
<head>

<title>border-radius percentage</title>
<style>

  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background-color: #1565c0;
    border-radius: 25%;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
