<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background radial-gradient</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background-image: radial-gradient(circle at center, #f57f17, #311b92);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
