<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border-width keywords thin medium thick</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 120px;
    background-color: #ffffff;
    border-style: solid;
    border-color: #4527a0;
    border-top-width: thin;
    border-right-width: medium;
    border-bottom-width: thick;
    border-left-width: medium;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
