<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border-radius per corner</title>
<style>
  @page { size: 278px 141px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 140px;
    background-color: #ef6c00;
    border-radius: 0 40px 0 40px;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
