<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background repeat repeat-x no-repeat-y</title>
<style>
  @page { size: 180px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 140px;
    height: 80px;
    margin: 20px;
    background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAEElEQVR42mN4amkKRwzEcQAyMhUx4RYvKgAAAABJRU5ErkJggg==");
    background-size: 20px 20px;
    background-repeat: repeat no-repeat;
    border: 4px solid #111111;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
