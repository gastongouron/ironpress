<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border-radius 50% ellipse on non-square box</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 220px;
    height: 120px;
    background-color: #4527a0;
    border-radius: 50%;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
