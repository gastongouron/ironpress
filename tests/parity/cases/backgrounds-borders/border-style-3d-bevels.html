<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border-style 3d bevels</title>
<style>
  @page { size: 360px 90px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .row {
    width: 360px;
    height: 90px;
    padding: 10px;
    font-size: 0;
    background: #f5f5f5;
  }
  .box {
    display: inline-block;
    width: 70px;
    height: 70px;
    margin-right: 16px;
    border-width: 16px;
    border-color: #00897b;
    background: #ffffff;
  }
  .box:last-child { margin-right: 0; }
  .groove { border-style: groove; }
  .ridge { border-style: ridge; }
  .inset { border-style: inset; }
  .outset { border-style: outset; }
</style>
</head>
<body>
  <div class="row">
    <div class="box groove"></div>
    <div class="box ridge"></div>
    <div class="box inset"></div>
    <div class="box outset"></div>
  </div>
</body>
</html>
