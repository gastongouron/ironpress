<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border color four value shorthand</title>
<style>
  @page { size: 190px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 130px;
    height: 90px;
    margin: 20px;
    border-style: solid;
    border-width: 12px;
    border-color: #e53935 #1e88e5 #43a047 #fdd835;
    background: #ffffff;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
