<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border style four value shorthand</title>
<style>
  @page { size: 180px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 120px;
    height: 80px;
    margin: 25px;
    border-width: 8px;
    border-color: #111111;
    border-style: solid dashed dotted double;
    background: #fdd835;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
