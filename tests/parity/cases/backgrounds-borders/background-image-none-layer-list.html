<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background image none layer list</title>
<style>
  @page { size: 200px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 160px;
    height: 90px;
    margin: 20px;
    background-image:
      none,
      url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAEElEQVR42mN4amkKRwzEcQAyMhUx4RYvKgAAAABJRU5ErkJggg==");
    background-size: 10px 10px, 30px 30px;
    background-repeat: repeat, no-repeat;
    background-position: left top, right bottom;
    border: 4px solid #111111;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
