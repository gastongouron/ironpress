<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>outline-offset negative (inward)</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .frame { padding: 24px; }
  .box {
    width: 160px;
    height: 100px;
    background-color: #e0e0e0;
    border: 2px solid #1b5e20;
    outline: 4px solid #b71c1c;
    outline-offset: -12px;
  }
</style>
</head>
<body>
  <div class="frame"><div class="box"></div></div>
</body>
</html>
