<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>conic-gradient background</title>
<style>
  @page { size: 278px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background: conic-gradient(#d50000, #2962ff, #00c853, #d50000);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
