<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background linear-gradient horizontal</title>
<style>
  @page { size: 318px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 240px;
    height: 120px;
    background-image: linear-gradient(to right, #d32f2f, #1976d2);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
