<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border solid width</title>
<style>
  @page { size: 277px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 120px;
    background-color: #eeeeee;
    border: 8px solid #c62828;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
