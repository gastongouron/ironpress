<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>interaction: border-radius clipping a linear-gradient background</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 240px;
    height: 160px;
    background-image: linear-gradient(to right, #d32f2f, #1976d2);
    border-radius: 32px;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
