<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background blend mode multiply image</title>
<style>
  @page { size: 180px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 120px;
    height: 80px;
    margin: 20px;
    background-color: #fdd835;
    background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAEElEQVR42mOQ63gKRwzEcQB1whixaofVswAAAABJRU5ErkJggg==");
    background-size: 120px 80px;
    background-repeat: no-repeat;
    background-blend-mode: multiply;
    border: 4px solid #111111;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
