<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background-repeat space round</title>
<style>
  @page { size: 180px 90px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 180px;
    height: 90px;
    background-color: #e8f5e9;
    background-image: linear-gradient(to bottom, #c62828 0 18px, #ffd54f 18px 24px);
    background-size: 40px 24px;
    background-repeat: space round;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
