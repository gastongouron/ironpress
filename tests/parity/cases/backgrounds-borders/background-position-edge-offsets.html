<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background-position edge offsets</title>
<style>
  @page { size: 180px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 180px;
    height: 130px;
    background-color: #1565c0;
    background-image: linear-gradient(#e53935, #e53935);
    background-size: 40px 40px;
    background-repeat: no-repeat;
    background-position: right 20px bottom 15px;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
