<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border-color transparent top, solid others</title>
<style>
  @page { size: 278px 121px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 120px;
    background-color: #ffffff;
    border: 12px solid #00695c;
    border-top-color: transparent;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
