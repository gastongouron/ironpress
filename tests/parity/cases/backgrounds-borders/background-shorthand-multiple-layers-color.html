<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background shorthand multiple layers color</title>
<style>
  @page { size: 220px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 180px;
    height: 110px;
    margin: 20px;
    background:
      url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAEElEQVR42mN4amkKRwzEcQAyMhUx4RYvKgAAAABJRU5ErkJggg==") left top / 32px 32px no-repeat,
      url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAEElEQVR42mOQ63gKRwzEcQB1whixaofVswAAAABJRU5ErkJggg==") right bottom / 32px 32px no-repeat #fdd835;
    border: 4px solid #111111;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
