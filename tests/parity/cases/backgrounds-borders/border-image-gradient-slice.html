<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border-image gradient slice</title>
<style>
  @page { size: 220px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 220px;
    height: 150px;
    border: 18px solid transparent;
    background: #fffde7;
    border-image: linear-gradient(to right, #d50000, #2962ff) 1;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
