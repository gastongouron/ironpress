<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border-style none paints nothing</title>
<style>
  @page { size: 277px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 120px;
    background-color: #ffe0b2;
    border-width: 10px;
    border-style: none;
    border-color: #d50000;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
