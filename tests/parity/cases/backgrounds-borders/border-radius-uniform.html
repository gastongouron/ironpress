<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>border-radius uniform</title>
<style>
  @page { size: 277px 123px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 120px;
    background-color: #6a1b9a;
    border: 4px solid #311b92;
    border-radius: 24px;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
