<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background clip padding-box dashed gradient</title>
<style>
  @page { size: 180px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 140px;
    height: 90px;
    margin: 20px;
    padding: 12px;
    border: 16px dashed #111111;
    background-image: linear-gradient(#e53935, #e53935);
    background-clip: padding-box;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
