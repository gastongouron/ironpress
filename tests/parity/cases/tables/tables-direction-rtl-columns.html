<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-direction-rtl-columns</title>
<style>
@page{size:240px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{direction:rtl;border-collapse:separate;border-spacing:0}td{width:70px;height:44px;border:2px solid #111}.a{background:#e63946}.b{background:#2a9d8f}
</style>
</head>
<body>
<table><tr><td class="a"></td><td class="b"></td></tr></table>
</body>
</html>
