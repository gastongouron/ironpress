<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-rowspan-zero</title>
<style>
  @page { size: 230px 180px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  table { border-collapse: separate; border-spacing: 0; }
  td { width: 56px; height: 36px; padding: 0; border: 2px solid #111111; }
  .span { background: #e63946; }
  .a { background: #ffbe0b; }
  .b { background: #2a9d8f; }
  .c { background: #8ecae6; }
</style>
</head>
<body>
  <table>
    <tbody>
      <tr><td class="span" rowspan="0"></td><td class="a"></td></tr>
      <tr><td class="b"></td></tr>
      <tr><td class="c"></td></tr>
    </tbody>
  </table>
</body>
</html>
