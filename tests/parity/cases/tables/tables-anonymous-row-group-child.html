<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-anonymous-row-group-child</title>
<style>
@page{size:240px 150px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}.t{display:table;border-collapse:separate;border-spacing:0}.rg{display:table-row-group}.r{display:table-row}.c{display:table-cell;width:70px;height:36px;background:#2a9d8f;border:2px solid #111}.loose{width:70px;height:36px;background:#1d3557}
</style>
</head>
<body>
<div class="t"><div class="rg"><div class="loose"></div><div class="r"><div class="c"></div></div></div></div>
</body>
</html>
