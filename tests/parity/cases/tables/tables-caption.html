<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-caption</title>
<style>
  @page { size: 412px 176px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; }
  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 300px;
    font-family: ParitySans;
  }
  caption {
    caption-side: top;
    height: 40px;
    line-height: 40px;
    font-size: 18px;
    color: #ffffff;
    background: #5f0f40;
    text-align: center;
  }
  td {
    width: 150px;
    height: 50px;
    border: 3px solid #5f0f40;
    background: #fb8b24;
  }
</style>
</head>
<body>
  <table>
    <caption>TABLE</caption>
    <tr><td></td><td></td></tr>
    <tr><td></td><td></td></tr>
  </table>
</body>
</html>
