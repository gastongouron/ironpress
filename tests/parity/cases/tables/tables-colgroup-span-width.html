<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-colgroup-span-width</title>
<style>
@page{size:290px 130px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{table-layout:fixed;width:200px;border-collapse:separate;border-spacing:0}td{height:42px;border:2px solid #111}.a{background:#e63946}.b{background:#ffbe0b}.c{background:#2a9d8f}
</style>
</head>
<body>
<table><colgroup span="2" style="width:50px"></colgroup><colgroup span="1" style="width:100px"></colgroup><tr><td class="a"></td><td class="b"></td><td class="c"></td></tr></table>
</body>
</html>
