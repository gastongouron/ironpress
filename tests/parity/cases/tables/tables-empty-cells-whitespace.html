<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-empty-cells-whitespace</title>
<style>
  @page { size: 402px 144px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: separate;
    border-spacing: 6px;
    table-layout: fixed;
    width: 360px;
    empty-cells: hide;
    background: #ffffff;
  }
  td {
    width: 112px;
    height: 100px;
    border: 3px solid #5f0f40;
    background: #f3d9e3;
    vertical-align: middle;
  }
  .mark { width: 40px; height: 40px; margin: 0 auto; background: #9a031e; }
</style>
</head>
<body>
  <table>
    <tr>
      <td><div class="mark"></div></td>
      <td>   </td>
      <td></td>
    </tr>
  </table>
</body>
</html>
