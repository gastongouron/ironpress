<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-collapse-directional-tie</title>
<style>
@page{size:240px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{border-collapse:collapse}td{width:76px;height:54px;padding:0}.a{background:#f1faee;border:0;border-right:8px solid #1d3557}.b{background:#ffbe0b;border:0;border-left:8px solid #d7263d}
</style>
</head>
<body>
<table><tr><td class="a"></td><td class="b"></td></tr></table>
</body>
</html>
