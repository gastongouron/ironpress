<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-vertical-align-baseline-sizes</title>
<style>
  @page { size: 472px 126px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 360px;
  }
  td {
    width: 120px;
    height: 90px;
    border: 3px solid #14213d;
    vertical-align: baseline;
    padding: 8px;
  }
  .a { background: #ffcad4; font-size: 12px; line-height: 16px; }
  .b { background: #b8e0d2; font-size: 24px; line-height: 28px; }
  .c { background: #d6eadf; font-size: 16px; line-height: 20px; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="a">x</td>
      <td class="b">x</td>
      <td class="c">x</td>
    </tr>
  </table>
</body>
</html>
