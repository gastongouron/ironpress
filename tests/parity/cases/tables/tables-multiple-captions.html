<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-multiple-captions</title>
<style>
@page{size:250px 180px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:16px}.t{display:table;border-collapse:separate;border-spacing:0}.cap{display:table-caption;height:30px;line-height:30px;color:#fff;text-align:center}.one{background:#5f0f40}.two{background:#1d3557}.r{display:table-row}.c{display:table-cell;width:70px;height:42px;background:#fb8b24;border:2px solid #111}
</style>
</head>
<body>
<div class="t"><div class="cap one">ONE</div><div class="cap two">TWO</div><div class="r"><div class="c"></div><div class="c"></div></div></div>
</body>
</html>
