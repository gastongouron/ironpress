<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-break-before-row</title>
<style>
@page{size:180px 100px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:0}table{border-collapse:separate;border-spacing:0}td{width:160px;height:40px;border:2px solid #111;background:#2a9d8f}.p2{break-before:page}.p2 td{background:#e63946}
</style>
</head>
<body>
<table><tr><td></td></tr><tr class="p2"><td></td></tr></table>
</body>
</html>
