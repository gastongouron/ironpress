<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-colspan</title>
<style>
  @page { size: 469px 145px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 360px;
  }
  td {
    width: 120px;
    height: 55px;
    border: 3px solid #14213d;
    background: #fca311;
  }
  .span2 { background: #e5e5e5; }
</style>
</head>
<body>
  <table>
    <tr><td class="span2" colspan="2"></td><td></td></tr>
    <tr><td></td><td></td><td></td></tr>
  </table>
</body>
</html>
