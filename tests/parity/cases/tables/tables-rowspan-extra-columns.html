<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-rowspan-extra-columns</title>
<style>
@page{size:300px 150px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{border-collapse:separate;border-spacing:0}td{width:56px;height:36px;border:2px solid #111}.span{background:#1d3557}.a{background:#e63946}.b{background:#ffbe0b}.c{background:#2a9d8f}
</style>
</head>
<body>
<table><tr><td class="span" rowspan="2"></td><td class="a"></td></tr><tr><td class="b"></td><td class="c"></td></tr></table>
</body>
</html>
