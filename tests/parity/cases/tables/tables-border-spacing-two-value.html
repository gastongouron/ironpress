<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-border-spacing-two-value</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: sans-serif; }
  table {
    border-collapse: separate;
    border-spacing: 24px 6px;
    table-layout: fixed;
    width: 336px;
    background: #ffb703;
  }
  td {
    width: 80px;
    height: 50px;
    border: 2px solid #023047;
    background: #8ecae6;
  }
</style>
</head>
<body>
  <table>
    <tr><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td></tr>
  </table>
</body>
</html>
