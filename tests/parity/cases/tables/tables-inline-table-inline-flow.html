<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-inline-table-inline-flow</title>
<style>
@page{size:300px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px;background:#fff;font-size:20px}.it{display:inline-table;border-collapse:separate;border-spacing:4px;background:#111;vertical-align:middle}.r{display:table-row}.c{display:table-cell;width:42px;height:34px}.a{background:#e63946}.b{background:#2a9d8f}.txt{background:#ffbe0b;color:#111}
</style>
</head>
<body>
<span class="txt">L</span><span class="it"><span class="r"><span class="c a"></span><span class="c b"></span></span></span><span class="txt">R</span>
</body>
</html>
