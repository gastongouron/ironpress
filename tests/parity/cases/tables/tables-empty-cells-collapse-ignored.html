<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-empty-cells-collapse-ignored</title>
<style>
@page{size:230px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{border-collapse:collapse;empty-cells:hide;background:#fff}td{width:62px;height:46px;border:4px solid #111;background:#e63946}.filled{background:#2a9d8f}
</style>
</head>
<body>
<table><tr><td></td><td class="filled"></td></tr></table>
</body>
</html>
