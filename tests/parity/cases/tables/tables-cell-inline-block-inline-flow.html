<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@page{size:296px 96px;margin:0}
html{font-family:ParitySans;font-size:16px;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#fff}
body{padding:12px}
table{border-collapse:collapse}
td{border:2px solid #222;padding:6px 8px;vertical-align:top}
.fill{display:inline-block;width:72px;border-bottom:2px solid #222}
.box{display:inline-block;width:14px;height:14px;border:2px solid #222;vertical-align:-2px}
</style>
</head>
<body>
<table><tr><td>NPO <span class="fill">&nbsp;</span> after <span class="box"></span> end</td></tr></table>
</body>
</html>
