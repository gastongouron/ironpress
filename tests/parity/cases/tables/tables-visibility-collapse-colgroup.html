<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-visibility-collapse-colgroup</title>
<style>
@page{size:320px 130px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{table-layout:fixed;width:210px;border-collapse:separate;border-spacing:0}.gone{visibility:collapse}td{height:44px;border:2px solid #111}.a{background:#1d3557}.b{background:#e63946}.c{background:#2a9d8f}
</style>
</head>
<body>
<table><colgroup class="gone" span="2"></colgroup><colgroup span="1"></colgroup><tr><td class="a"></td><td class="b"></td><td class="c"></td></tr></table>
</body>
</html>
