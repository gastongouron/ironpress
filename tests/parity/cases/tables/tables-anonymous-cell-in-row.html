<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-anonymous-cell-in-row</title>
<style>
@page{size:250px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}.t{display:table;border-collapse:separate;border-spacing:0}.r{display:table-row}.cell{display:table-cell;width:62px;height:44px;background:#e63946;border:2px solid #111}.loose{width:62px;height:44px;background:#2a9d8f;border:2px solid #111}
</style>
</head>
<body>
<div class="t"><div class="r"><div class="cell"></div><div class="loose"></div></div></div>
</body>
</html>
