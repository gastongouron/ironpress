<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-caption-side-bottom</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: sans-serif; }
  table {
    border-collapse: separate;
    border-spacing: 8px;
    table-layout: fixed;
    width: 360px;
    caption-side: bottom;
    background: #ffffff;
  }
  caption {
    height: 36px;
    background: #e9c46a;
  }
  td {
    width: 168px;
    height: 90px;
    border: 3px solid #264653;
    background: #e9f5f3;
  }
</style>
</head>
<body>
  <table>
    <caption></caption>
    <tr><td></td><td></td></tr>
    <tr><td></td><td></td></tr>
  </table>
</body>
</html>
