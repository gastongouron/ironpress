<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-border-width-conflict</title>
<style>
  @page { size: 240px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 20px; }
  table { border-collapse: collapse; }
  td { width: 82px; height: 62px; padding: 0; border: 0; }
  .a { background: #a8dadc; border-right: 14px solid #1f77b4; }
  .b { background: #f1faee; border-left: 4px solid #d7263d; }
</style>
</head>
<body>
  <table>
    <tr><td class="a"></td><td class="b"></td></tr>
  </table>
</body>
</html>
