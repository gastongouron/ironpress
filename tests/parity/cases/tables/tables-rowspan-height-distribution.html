<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-rowspan-height-distribution</title>
<style>
@page{size:260px 180px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{border-collapse:separate;border-spacing:0;background:#ffbe0b}td{width:64px;height:28px;border:2px solid #111;background:#a8dadc}.span{height:100px;background:#e63946}.b{background:#2a9d8f}
</style>
</head>
<body>
<table><tr><td class="span" rowspan="2"></td><td class="b"></td></tr><tr><td class="b"></td></tr></table>
</body>
</html>
