<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-fixed-colspan-width-split</title>
<style>
@page{size:280px 130px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{table-layout:fixed;width:180px;border-collapse:separate;border-spacing:0}td{height:38px;border:2px solid #111}.span{width:120px;background:#1d3557}.third{width:60px;background:#e63946}.a{background:#ffbe0b}.b{background:#2a9d8f}.c{background:#a8dadc}
</style>
</head>
<body>
<table><tr><td class="span" colspan="2"></td><td class="third"></td></tr><tr><td class="a"></td><td class="b"></td><td class="c"></td></tr></table>
</body>
</html>
