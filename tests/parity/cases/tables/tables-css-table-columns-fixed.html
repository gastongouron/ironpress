<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-css-table-columns-fixed</title>
<style>
@page{size:270px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}.t{display:table;table-layout:fixed;width:180px;border-collapse:separate;border-spacing:0}.cg{display:table-column-group}.col1{display:table-column;width:50px}.col2{display:table-column;width:130px}.r{display:table-row}.c{display:table-cell;height:48px;border:2px solid #111}.a{background:#e63946}.b{background:#2a9d8f}
</style>
</head>
<body>
<div class="t"><div class="cg"><div class="col1"></div><div class="col2"></div></div><div class="r"><div class="c a"></div><div class="c b"></div></div></div>
</body>
</html>
