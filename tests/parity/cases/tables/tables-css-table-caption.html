<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-css-table-caption</title>
<style>
@page{size:260px 150px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:16px}.t{display:table;border-collapse:separate;border-spacing:0}.cap{display:table-caption;height:34px;background:#5f0f40;color:#fff;text-align:center}.r{display:table-row}.c{display:table-cell;width:70px;height:42px;background:#fb8b24;border:2px solid #111}
</style>
</head>
<body>
<div class="t"><div class="cap">CAP</div><div class="r"><div class="c"></div><div class="c"></div></div></div>
</body>
</html>
