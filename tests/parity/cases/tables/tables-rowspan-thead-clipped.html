<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-rowspan-thead-clipped</title>
<style>
@page{size:270px 170px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:16px}table{border-collapse:separate;border-spacing:0}td{width:62px;height:34px;border:2px solid #111}.head{background:#1d3557}.body1{background:#e63946}.body2{background:#2a9d8f}
</style>
</head>
<body>
<table><thead><tr><td class="head" rowspan="3"></td><td class="head"></td></tr></thead><tbody><tr><td class="body1"></td><td class="body2"></td></tr><tr><td class="body2"></td><td class="body1"></td></tr></tbody></table>
</body>
</html>
