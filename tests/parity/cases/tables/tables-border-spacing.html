<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-border-spacing</title>
<style>
  @page { size: 421px 168px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: separate;
    border-spacing: 12px;
    table-layout: fixed;
    width: 312px;
    background: #ffd166;
  }
  td {
    width: 80px;
    height: 50px;
    border: 2px solid #073b4c;
    background: #06d6a0;
  }
</style>
</head>
<body>
  <table>
    <tr><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td></tr>
  </table>
</body>
</html>
