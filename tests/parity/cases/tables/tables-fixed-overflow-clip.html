<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-fixed-overflow-clip</title>
<style>
  @page { size: 220px 110px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 20px; }
  table {
    table-layout: fixed;
    width: 120px;
    border-collapse: separate;
    border-spacing: 0;
  }
  td {
    width: 60px;
    height: 46px;
    padding: 0;
    border: 2px solid #111111;
    font-size: 22px;
    line-height: 46px;
    white-space: nowrap;
    overflow: hidden;
  }
  .a { background: #ffbe0b; color: #d7263d; }
  .b { background: #2a9d8f; color: #111111; }
</style>
</head>
<body>
  <table>
    <tr><td class="a">AAAAAAAAAAAA</td><td class="b"></td></tr>
  </table>
</body>
</html>
