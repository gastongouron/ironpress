<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-second-header-group-not-repeat</title>
<style>
@page{size:190px 130px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:0}.t{display:table;border-collapse:separate;border-spacing:0}.hg{display:table-header-group}.rg{display:table-row-group}.r{display:table-row}.c{display:table-cell;width:170px;height:38px;border:2px solid #111}.first .c{background:#1d3557}.second .c{background:#8ecae6}.body .c{background:#f1faee}
</style>
</head>
<body>
<div class="t"><div class="hg first"><div class="r"><div class="c"></div></div></div><div class="hg second"><div class="r"><div class="c"></div></div></div><div class="rg body"><div class="r"><div class="c"></div></div><div class="r"><div class="c"></div></div><div class="r"><div class="c"></div></div></div></div>
</body>
</html>
