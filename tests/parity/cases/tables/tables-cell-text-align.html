<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-cell-text-align</title>
<style>
  @page { size: 472px 86px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; }
  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 360px;
    font-family: ParityMono;
    font-size: 16px;
    color: #1d1d1d;
  }
  td {
    width: 120px;
    height: 50px;
    border: 3px solid #1d1d1d;
    background: #f0e9d2;
    line-height: 44px;
  }
  .l { text-align: left; }
  .c { text-align: center; }
  .r { text-align: right; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="l">AB</td>
      <td class="c">AB</td>
      <td class="r">AB</td>
    </tr>
  </table>
</body>
</html>
