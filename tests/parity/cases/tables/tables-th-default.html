<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-th-default</title>
<style>
  @page { size: 472px 256px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 360px;
    font-size: 13px;
  }
  th, td {
    width: 180px;
    height: 110px;
    border: 3px solid #22223b;
    line-height: 104px;
    color: #22223b;
  }
  th { background: #c9ccd6; }
  td { background: #f2e9e4; }
</style>
</head>
<body>
  <table>
    <tr><th>A</th><th>B</th></tr>
    <tr><td>c</td><td>d</td></tr>
  </table>
</body>
</html>
