<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-visibility-collapse-cell</title>
<style>
@page{size:240px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{border-collapse:separate;border-spacing:0;background:#ffbe0b}td{width:70px;height:44px;border:2px solid #111}.gone{visibility:collapse;background:#e63946;color:#111}.ok{background:#2a9d8f}
</style>
</head>
<body>
<table><tr><td class="gone">X</td><td class="ok"></td></tr></table>
</body>
</html>
