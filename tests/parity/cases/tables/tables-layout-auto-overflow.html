<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-layout-auto-overflow</title>
<style>
  @page { size: 392px 74px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: collapse;
    table-layout: auto;
    width: 160px;
    font-size: 16px;
  }
  td {
    border: 3px solid #3d405b;
    padding: 8px;
    white-space: nowrap;
    line-height: 20px;
  }
  .a { background: #f4a261; }
  .b { background: #81b29a; }
</style>
</head>
<body>
  <table>
    <tr><td class="a">WideContentXY</td><td class="b">MoreWideText</td></tr>
  </table>
</body>
</html>
