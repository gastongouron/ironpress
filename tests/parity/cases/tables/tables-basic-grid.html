<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-basic-grid</title>
<style>
  @page { size: 472px 155px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 360px;
  }
  td {
    width: 120px;
    height: 60px;
    border: 3px solid #1d3557;
    background: #a8dadc;
  }
</style>
</head>
<body>
  <table>
    <tr><td></td><td></td><td></td></tr>
    <tr><td></td><td></td><td></td></tr>
  </table>
</body>
</html>
