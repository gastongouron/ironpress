<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-cellpadding-attribute</title>
<style>
@page{size:230px 130px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{border-collapse:separate;border-spacing:0}td{width:80px;height:60px;border:2px solid #111;background:#a8dadc}.mark{width:28px;height:20px;background:#e63946}
</style>
</head>
<body>
<table cellpadding="16"><tr><td><div class="mark"></div></td></tr></table>
</body>
</html>
