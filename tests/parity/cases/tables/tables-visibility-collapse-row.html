<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-visibility-collapse-row</title>
<style>
@page{size:230px 170px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:16px}table{border-collapse:separate;border-spacing:0 8px;background:#111}td{width:70px;height:34px;background:#2a9d8f;border:2px solid #111}.gone{visibility:collapse}.gone td{background:#e63946}
</style>
</head>
<body>
<table><tr><td></td></tr><tr class="gone"><td></td></tr><tr><td></td></tr></table>
</body>
</html>
