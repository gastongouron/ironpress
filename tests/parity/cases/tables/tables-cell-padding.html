<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-cell-padding</title>
<style>
  @page { size: 432px 105px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 320px;
  }
  td {
    width: 160px;
    height: 70px;
    border: 3px solid #1a1a2e;
    background: #16213e;
    padding: 20px;
  }
  .inner {
    width: 100%;
    height: 100%;
    background: #e94560;
  }
</style>
</head>
<body>
  <table>
    <tr><td><div class="inner"></div></td><td><div class="inner"></div></td></tr>
  </table>
</body>
</html>
