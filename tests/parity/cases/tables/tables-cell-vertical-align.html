<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-cell-vertical-align</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: sans-serif; }
  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 360px;
  }
  td {
    width: 120px;
    height: 120px;
    border: 3px solid #2f3e46;
    background: #cad2c5;
  }
  .marker {
    width: 60px;
    height: 24px;
    background: #52796f;
  }
  .top { vertical-align: top; }
  .middle { vertical-align: middle; }
  .bottom { vertical-align: bottom; }
</style>
</head>
<body>
  <table>
    <tr>
      <td class="top"><div class="marker"></div></td>
      <td class="middle"><div class="marker"></div></td>
      <td class="bottom"><div class="marker"></div></td>
    </tr>
  </table>
</body>
</html>
