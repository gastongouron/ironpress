<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-empty-cells-hide</title>
<style>
  @page { size: 433px 151px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: separate;
    border-spacing: 6px;
    empty-cells: hide;
    table-layout: fixed;
    width: 312px;
    background: #ffffff;
  }
  td {
    width: 100px;
    height: 50px;
    border: 3px solid #390099;
    background: #ff5400;
  }
  .filled {
    background: #ff5400;
  }
  .empty {
    /* no content -> hidden border/background under empty-cells:hide */
  }
</style>
</head>
<body>
  <table>
    <tr><td class="filled">&nbsp;</td><td class="empty"></td><td class="filled">&nbsp;</td></tr>
    <tr><td class="empty"></td><td class="filled">&nbsp;</td><td class="empty"></td></tr>
  </table>
</body>
</html>
