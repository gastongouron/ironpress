<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-rowspan</title>
<style>
  @page { size: 412px 145px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 16px; font-family: ParitySans; }
  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 300px;
  }
  td {
    width: 100px;
    height: 55px;
    border: 3px solid #003049;
    background: #d62828;
  }
  .tall { background: #fcbf49; }
</style>
</head>
<body>
  <table>
    <tr><td class="tall" rowspan="2"></td><td></td><td></td></tr>
    <tr><td></td><td></td></tr>
  </table>
</body>
</html>
