<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-cellspacing-attribute</title>
<style>
@page{size:260px 130px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
html,body{background:#ffffff}
body{padding:18px}table{background:#111}td{width:50px;height:42px;padding:0;border:0}.a{background:#e63946}.b{background:#2a9d8f}
</style>
</head>
<body>
<table cellspacing="14"><tr><td class="a"></td><td class="b"></td></tr></table>
</body>
</html>
