<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tables-collapse-ignores-spacing</title>
<style>
  @page { size: 240px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 20px; }
  table { border-collapse: collapse; border-spacing: 30px; background: #111111; }
  td { width: 60px; height: 50px; padding: 0; border: 4px solid #111111; }
  .a { background: #e63946; }
  .b { background: #2a9d8f; }
</style>
</head>
<body>
  <table>
    <tr><td class="a"></td><td class="b"></td></tr>
  </table>
</body>
</html>
