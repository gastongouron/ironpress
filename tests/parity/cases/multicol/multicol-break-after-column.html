<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>multicol break-after column</title><style>
@page{size:240px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cols{width:220px;height:100px;column-count:2;column-gap:20px;column-fill:auto;background:#f8fafc}.item{height:40px;font-size:12px}.one{background:#ffd166;break-after:column}.two{background:#16a34a}.three{background:#93c5fd}
</style></head><body><div class="cols"><div class="item one">one</div><div class="item two">two</div><div class="item three">three</div></div></body></html>
