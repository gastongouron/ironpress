<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>multicol column-gap normal</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .cols {
    column-count: 3;
    font-size: 16px;
    width: 462px;
    height: 180px;
    margin: 20px;
    background: #f7eef7;
    border: 2px solid #7a1f7a;
  }
  .block {
    height: 50px;
    margin-bottom: 8px;
    background: #2ec4b6;
    border: 2px solid #0a4a44;
  }
</style>
</head>
<body>
  <div class="cols">
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
  </div>
</body>
</html>
