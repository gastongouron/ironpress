<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>multicol writing-mode vertical-rl</title><style>
@page{size:220px 160px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cols{writing-mode:vertical-rl;width:200px;height:140px;column-count:2;column-gap:20px;column-fill:auto;background:#f8fafc}.item{width:40px;height:80px;font-size:12px}.a{background:#ef476f}.b{background:#ffd166}.c{background:#06d6a0}
</style></head><body><div class="cols"><div class="item a">A</div><div class="item b">B</div><div class="item c">C</div></div></body></html>
