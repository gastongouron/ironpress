<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 240px 120px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    .cols { width: 220px; height: 110px; column-count: 2; column-gap: 20px; column-fill: auto; background: #f8fafc; }
    .item { height: 45px; font-size: 12px; color: #111111; }
    .one { background: #ffd166; }
    .force { break-before: column; background: #16a34a; }
    .tail { background: #93c5fd; }
  </style>
</head>
<body>
  <div class="cols">
    <div class="item one">one</div>
    <div class="item force">forced</div>
    <div class="item tail">tail</div>
  </div>
</body>
</html>
