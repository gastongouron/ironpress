<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>multicol columns count-only</title>
<style>
  @page { size: 598px 221px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .cols {
    columns: 4;
    column-gap: 20px;
    width: 480px;
    height: 180px;
    margin: 20px;
    background: #eef7ee;
    border: 2px solid #1f7a1f;
  }
  .block {
    height: 50px;
    margin-bottom: 8px;
    background: #ff5a5f;
    border: 2px solid #7a0010;
  }
</style>
</head>
<body>
  <div class="cols">
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
  </div>
</body>
</html>
