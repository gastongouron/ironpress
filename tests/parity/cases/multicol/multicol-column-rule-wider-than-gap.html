<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>multicol column rule wider than gap</title><style>
@page{size:240px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cols{width:220px;height:80px;column-count:2;column-gap:4px;column-rule:18px solid #e63946;column-fill:auto;background:#f8fafc}.item{height:35px;background:#118ab2;color:#fff;font-size:10px;border-bottom:2px solid #fff}
</style></head><body><div class="cols"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div></div></body></html>
