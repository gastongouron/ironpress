<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>multicol column-count-three</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .cols {
    column-count: 3;
    width: 480px;
    height: 200px;
    margin: 20px;
    background: #e8eef7;
    border: 2px solid #003a8c;
  }
  .block {
    height: 56px;
    margin-bottom: 8px;
    background: #ff5a5f;
    border: 2px solid #7a0010;
  }
</style>
</head>
<body>
  <div class="cols">
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
  </div>
</body>
</html>
