<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 240px 100px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    .cols { margin: 10px; width: 210px; height: 60px; column-count: 3; column-gap: 20px; column-rule: 8px solid #e63946; column-fill: auto; background: #f8fafc; }
    .item { height: 40px; background: #118ab2; color: #ffffff; font-size: 10px; }
  </style>
</head>
<body>
  <div class="cols">
    <div class="item">only one column has content</div>
  </div>
</body>
</html>
