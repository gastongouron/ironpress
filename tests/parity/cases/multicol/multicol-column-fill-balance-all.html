<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>multicol column-fill balance-all</title><style>
@page{size:220px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cols{width:220px;column-count:2;column-gap:20px;column-fill:balance-all;background:#f8fafc}.item{height:38px;background:#16a34a;border-bottom:2px solid #fff;font-size:10px}
</style></head><body><div class="cols"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div><div class="item">5</div><div class="item">6</div><div class="item">7</div><div class="item">8</div></div></body></html>
