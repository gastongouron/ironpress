<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>multicol page-break flow</title>
<style>
  /* A short page so an auto-height two-column container overflows it: the
     columns must fill page 1, then continue as a fresh row of columns on
     page 2 (CSS Multicol L1 §2), rather than overflowing and being clipped. */
  @page { size: 360px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .cols {
    column-count: 2;
    column-gap: 16px;
    column-fill: auto;
  }
  /* 50px blocks tile the 150px page content box exactly 3 per column, so each
     page holds two columns of three (six blocks); twelve blocks => two pages. */
  .block {
    height: 50px;
    border: 2px solid #0a2a6b;
  }
  .a { background: #ff5a5f; }
  .b { background: #5a3fff; }
</style>
</head>
<body>
  <div class="cols">
    <div class="block a"></div>
    <div class="block b"></div>
    <div class="block a"></div>
    <div class="block b"></div>
    <div class="block a"></div>
    <div class="block b"></div>
    <div class="block a"></div>
    <div class="block b"></div>
    <div class="block a"></div>
    <div class="block b"></div>
    <div class="block a"></div>
    <div class="block b"></div>
  </div>
</body>
</html>
