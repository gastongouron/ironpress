<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>multicol break-inside avoid-column</title><style>
@page{size:240px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cols{width:220px;height:90px;column-count:2;column-gap:20px;column-fill:auto;background:#f8fafc}.lead{height:45px;background:#bfdbfe}.card{height:60px;background:#f97316;break-inside:avoid-column;border:3px solid #111}
</style></head><body><div class="cols"><div class="lead"></div><div class="card"></div></div></body></html>
