<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>multicol columns width-only</title>
<style>
  @page { size: 577px 221px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .cols {
    columns: 140px;
    column-gap: 20px;
    width: 460px;
    height: 180px;
    margin: 20px;
    background: #fff4e6;
    border: 2px solid #a85b00;
  }
  .block {
    height: 50px;
    margin-bottom: 8px;
    background: #ffbf00;
    border: 2px solid #7a5b00;
  }
</style>
</head>
<body>
  <div class="cols">
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
    <div class="block"></div>
  </div>
</body>
</html>
