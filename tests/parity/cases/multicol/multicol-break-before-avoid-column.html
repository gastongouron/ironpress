<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>multicol break-before avoid-column</title><style>
@page{size:240px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cols{width:220px;height:90px;column-count:2;column-gap:20px;column-fill:auto;background:#f8fafc}.lead{height:52px;background:#bfdbfe}.head{height:25px;background:#ef476f;font-size:12px}.para{height:35px;background:#06d6a0;break-before:avoid-column;font-size:12px}
</style></head><body><div class="cols"><div class="lead"></div><div class="head">H</div><div class="para">P</div></div></body></html>
