<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>multicol direction rtl columns</title><style>
@page{size:260px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cols{direction:rtl;width:240px;height:90px;column-count:3;column-gap:15px;column-fill:auto;background:#f8fafc}.item{height:30px;font-size:10px}.a{background:#ef476f}.b{background:#ffd166}.c{background:#06d6a0}
</style></head><body><div class="cols"><div class="item a">A</div><div class="item b">B</div><div class="item c">C</div></div></body></html>
