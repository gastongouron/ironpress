<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>multicol overflow columns auto</title><style>
@page{size:360px 140px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cols{width:220px;height:70px;column-count:2;column-gap:20px;column-fill:auto;background:#f8fafc}.item{height:30px;font-size:10px;border-bottom:2px solid #fff;background:#118ab2;color:#fff}
</style></head><body><div class="cols"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div><div class="item">5</div><div class="item">6</div></div></body></html>
