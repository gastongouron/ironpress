<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 260px 120px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    .cols { margin: 10px; width: 240px; height: 80px; column-count: 3; column-gap: 10%; column-fill: auto; background: #f8fafc; }
    .item { height: 30px; background: #118ab2; color: #ffffff; font-size: 10px; border-bottom: 2px solid #ffffff; }
  </style>
</head>
<body>
  <div class="cols">
    <div class="item">A</div>
    <div class="item">B</div>
    <div class="item">C</div>
    <div class="item">D</div>
    <div class="item">E</div>
    <div class="item">F</div>
  </div>
</body>
</html>
