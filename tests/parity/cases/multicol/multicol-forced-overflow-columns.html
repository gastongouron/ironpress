<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>multicol forced overflow columns</title><style>
@page{size:360px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cols{width:220px;height:80px;columns:100px;column-gap:20px;column-fill:auto;background:#f8fafc}.item{height:40px;width:100%;font-size:12px}.a{background:#ef476f;break-after:column}.b{background:#ffd166;break-after:column}.c{background:#06d6a0}
</style></head><body><div class="cols"><div class="item a">A</div><div class="item b">B</div><div class="item c">C</div></div></body></html>
