<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>multicol column-count-text</title>
<style>
  @page { size: 537px 225px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .cols {
    column-count: 2;
    width: 420px;
    margin: 20px;
    background: #eef7ee;
    border: 2px solid #1f7a1f;
    padding: 8px;
    font-family: ParitySans;
    font-size: 16px;
    line-height: 22px;
    color: #102a10;
  }
  .cols p { margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="cols">
    <p>One two three four five six seven eight nine ten eleven twelve.</p>
    <p>Alpha beta gamma delta epsilon zeta eta theta iota kappa lambda.</p>
    <p>Red orange yellow green blue indigo violet black white grey.</p>
    <p>North south east west up down left right near far high low.</p>
  </div>
</body>
</html>
