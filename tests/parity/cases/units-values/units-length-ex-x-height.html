<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 260px 90px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body {
    background: #ffffff;
    font-family: ParitySerif;
    font-size: 16px;
  }
  .em,
  .ex {
    height: 28px;
  }
  .em {
    width: 10em;
    background: #c62828;
  }
  .ex {
    width: 20ex;
    background: #0a7f2e;
  }
</style>
</head>
<body>
  <div class="em"></div>
  <div class="ex"></div>
</body>
</html>
