<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>length unit em</title>
<style>
  @page { size: 317px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* font-size:20px on the box -> 1em = 20px; width 12em = 240px, height 6em = 120px */
  .box {
    font-size: 20px;
    width: 12em;
    height: 6em;
    background: #2d6cdf;
    border: 0.2em solid #11305f;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
