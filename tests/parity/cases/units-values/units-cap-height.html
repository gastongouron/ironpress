<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 260px 80px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body {
    background: #ffffff;
    font-family: ParitySerif;
    font-size: 20px;
  }
  .em,
  .cap {
    height: 24px;
  }
  .em {
    width: 10em;
    background: #c62828;
  }
  .cap {
    width: 10cap;
    background: #0a7f2e;
  }
</style>
</head>
<body>
  <div class="em"></div>
  <div class="cap"></div>
</body>
</html>
