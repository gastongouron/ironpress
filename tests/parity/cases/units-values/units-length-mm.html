<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>length unit mm</title>
<style>
  @page { size: 317px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* 1mm = 1/10cm = 96/25.4 = 3.7795px. 63.5mm = 240px wide, 31.75mm = 120px tall. */
  .box {
    width: 63.5mm;
    height: 31.75mm;
    background: #d95f02;
    border: 4px solid #6e3001;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
