<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>length unit pc</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* 1pc = 1/6in = 16px. 15pc = 240px wide, 7.5pc = 120px tall; 0.25pc = 4px border. */
  .box {
    width: 15pc;
    height: 7.5pc;
    background: #2d6cdf;
    border: 0.25pc solid #11305f;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
