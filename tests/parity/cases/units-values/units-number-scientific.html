<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scientific-notation number in a length</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* css-values-4 5.2: <number> accepts scientific notation. 2.4e2px = 240px wide,
     1.2e2px = 120px tall. */
  .box {
    width: 2.4e2px;
    height: 1.2e2px;
    background: #1f78b4;
    border: 4px solid #0b3a59;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
