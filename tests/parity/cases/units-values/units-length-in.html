<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>length unit in</title>
<style>
  @page { size: 317px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* 2.5in = 240px, 1.25in = 120px (1in = 96px) */
  .box {
    width: 2.5in;
    height: 1.25in;
    background: #1b9e77;
    border: 4px solid #0b4a38;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
