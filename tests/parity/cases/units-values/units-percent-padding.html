<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>percentage padding resolves against containing-block width</title>
<style>
  @page { size: 477px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: content-box; }
  html, body { background: #ffffff; }
  /* css-values-4 5.5 + CSS2 box model: padding percentages resolve against the
     containing block WIDTH on BOTH axes (not height). Parent 400px wide.
     child content 200x0px, padding: 25% on every side = 100px (25% of 400 width)
     including padding-top/bottom, so the painted box is 400x200px. */
  .parent { width: 400px; background: #dddddd; }
  .child {
    width: 200px;
    height: 0;
    padding: 25%;
    background: #2d6cdf;
  }
</style>
</head>
<body>
  <div class="parent">
    <div class="child"></div>
  </div>
</body>
</html>
