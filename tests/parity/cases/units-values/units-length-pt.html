<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>length unit pt</title>
<style>
  @page { size: 317px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* 180pt = 240px (1px = 0.75pt); 90pt = 120px */
  .box {
    width: 180pt;
    height: 90pt;
    background: #2d6cdf;
    border: 3pt solid #11305f;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
