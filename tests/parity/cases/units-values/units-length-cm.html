<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>length unit cm</title>
<style>
  @page { size: 266px 114px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* 5cm wide, 3cm tall (1cm = 96/2.54 = 37.795px -> ~189x113px) */
  .box {
    width: 5cm;
    height: 3cm;
    background: #d95f02;
    border: 4px solid #6e3001;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
