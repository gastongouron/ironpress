<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>length unit Q</title>
<style>
  @page { size: 317px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* 1Q = 1/40cm = 96/(2.54*40) = 0.94488px. 254Q = 240px wide, 127Q = 120px tall. */
  .box {
    width: 254Q;
    height: 127Q;
    background: #1b9e77;
    border: 4px solid #0a4231;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
