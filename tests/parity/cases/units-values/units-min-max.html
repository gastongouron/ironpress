<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>min and max value functions</title>
<style>
  @page { size: 317px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* Aspirational: standalone min()/max() value functions.
     width = max(150px, 240px) = 240px; height = min(120px, 300px) = 120px. */
  .box {
    width: max(150px, 240px);
    height: min(120px, 300px);
    background: #1f78b4;
    border: 4px solid #0b3a59;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
