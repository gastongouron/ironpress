<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 320px 180px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body {
    padding: 18px;
    font-family: ParitySans;
    font-size: 18px;
  }
  .min,
  .max {
    background: #0a7f2e;
    margin-bottom: 8px;
    white-space: normal;
    color: #0a7f2e;
  }
  .min { width: min-content; }
  .max { width: max-content; }
  .ratio {
    width: 40vmin;
    max-width: 30vmax;
    aspect-ratio: 2 / 1;
    background: #004b8d;
  }
</style>
</head>
<body>
  <div class="min">alpha beta</div>
  <div class="max">alpha beta</div>
  <div class="ratio"></div>
</body>
</html>
