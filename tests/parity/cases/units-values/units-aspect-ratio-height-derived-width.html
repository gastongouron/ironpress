<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 260px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .parent {
    width: 220px;
    height: 90px;
    background: #c62828;
  }
  .box {
    width: auto;
    height: 60px;
    aspect-ratio: 2 / 1;
    background: #0a7f2e;
  }
</style>
</head>
<body>
  <div class="parent"><div class="box"></div></div>
</body>
</html>
