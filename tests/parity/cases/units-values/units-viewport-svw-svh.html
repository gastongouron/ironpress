<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 300px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 50svw;
    height: 25svh;
    background: #0a7f2e;
  }
  .ref {
    position: absolute;
    left: 150px;
    top: 50px;
    width: 20px;
    height: 20px;
    background: #c62828;
  }
</style>
</head>
<body>
  <div class="box"></div>
  <div class="ref"></div>
</body>
</html>
