<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 240px 180px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .scene {
    position: absolute;
    left: 45px;
    top: 35px;
    width: 150px;
    height: 120px;
    background: #f2f2f2;
    perspective: 200px;
  }
  .ref,
  .target {
    position: absolute;
    left: 45px;
    top: 35px;
    width: 60px;
    height: 45px;
  }
  .ref { background: #c62828; }
  .target {
    background: #0a7f2e;
    transform: translateZ(80px);
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="ref"></div>
    <div class="target"></div>
  </div>
</body>
</html>
