<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transform compound rotate translate</title>
<style>
  @page { size: 497px 320px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* Chained functions: translate(120px,40px) then rotate(25deg), applied
     left-to-right in the box's own coordinate space. Aspirational:
     parse_transform returns a single Transform, so chaining is not
     supported by ironpress (surface map: missing) */
  .frame {
    position: relative;
    width: 360px;
    height: 260px;
    margin: 30px;
    background: #eef2f7;
    border: 2px solid #b0bec5;
  }
  .guide {
    position: absolute;
    top: 30px;
    left: 30px;
    width: 130px;
    height: 90px;
    background: #cfd8dc;
  }
  .box {
    position: absolute;
    top: 30px;
    left: 30px;
    width: 130px;
    height: 90px;
    background: #bf360c;
    transform: translate(120px, 40px) rotate(25deg);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="guide"></div>
    <div class="box"></div>
  </div>
</body>
</html>
