<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 240px 180px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap {
    position: absolute;
    left: 40px;
    top: 25px;
    width: 160px;
    height: 130px;
    perspective: 260px;
  }
  .ref,
  .target {
    position: absolute;
    left: 40px;
    top: 35px;
    width: 85px;
    height: 65px;
  }
  .ref { background: #c62828; }
  .target {
    background: #0a7f2e;
    transform-origin: 50% 50%;
    transform: rotate3d(1, 1, 0, 62deg);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="ref"></div>
    <div class="target"></div>
  </div>
</body>
</html>
