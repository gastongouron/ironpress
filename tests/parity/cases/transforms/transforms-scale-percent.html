<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 240px 180px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .ref,
  .target {
    position: absolute;
    left: 40px;
    top: 50px;
    width: 80px;
    height: 60px;
  }
  .ref { background: #c62828; }
  .target {
    background: #0a7f2e;
    transform-origin: 0 0;
    transform: scale(150%, 50%);
  }
</style>
</head>
<body>
  <div class="ref"></div>
  <div class="target"></div>
</body>
</html>
