<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transform translate em</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* em length args resolve against the element's own font-size. At 20px
     font-size, translate(3em, 2em) == translate(60px, 40px). */
  .frame {
    position: relative;
    width: 320px;
    height: 220px;
    margin: 30px;
    background: #eef2f7;
    border: 2px solid #b0bec5;
  }
  .guide {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 120px;
    height: 90px;
    background: #cfd8dc;
  }
  .box {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 120px;
    height: 90px;
    font-size: 20px;
    background: #ad1457;
    transform: translate(3em, 2em);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="guide"></div>
    <div class="box"></div>
  </div>
</body>
</html>
