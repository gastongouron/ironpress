<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transform translateX percent</title>
<style>
  @page { size: 457px 261px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* translateX(100%) shifts the box right by its own width (120px), so it
     lands flush to the right of its starting slot. */
  .frame {
    position: relative;
    width: 320px;
    height: 200px;
    margin: 30px;
    background: #eef2f7;
    border: 2px solid #b0bec5;
  }
  .guide {
    position: absolute;
    top: 30px;
    left: 20px;
    width: 120px;
    height: 90px;
    background: #cfd8dc;
  }
  .box {
    position: absolute;
    top: 30px;
    left: 20px;
    width: 120px;
    height: 90px;
    background: #00897b;
    transform: translateX(100%);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="guide"></div>
    <div class="box"></div>
  </div>
</body>
</html>
