<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transform translateY percent</title>
<style>
  @page { size: 457px 301px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* translateY(100%) shifts the box down by its own height (90px). */
  .frame {
    position: relative;
    width: 320px;
    height: 240px;
    margin: 30px;
    background: #eef2f7;
    border: 2px solid #b0bec5;
  }
  .guide {
    position: absolute;
    top: 20px;
    left: 30px;
    width: 120px;
    height: 90px;
    background: #cfd8dc;
  }
  .box {
    position: absolute;
    top: 20px;
    left: 30px;
    width: 120px;
    height: 90px;
    background: #6a1b9a;
    transform: translateY(100%);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="guide"></div>
    <div class="box"></div>
  </div>
</body>
</html>
