<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transform scale single arg</title>
<style>
  @page { size: 457px 301px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* scale(1.5) with the second arg omitted scales BOTH axes by 1.5 about
     the box center. */
  .frame {
    position: relative;
    width: 320px;
    height: 240px;
    margin: 30px;
    background: #eef2f7;
    border: 2px solid #b0bec5;
  }
  .box {
    position: absolute;
    top: 70px;
    left: 90px;
    width: 140px;
    height: 100px;
    background: #00838f;
    transform: scale(1.5);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="box"></div>
  </div>
</body>
</html>
