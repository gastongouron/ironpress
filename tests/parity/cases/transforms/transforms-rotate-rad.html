<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transform rotate rad</title>
<style>
  @page { size: 437px 320px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* rotate(0.5236rad) == rotate(30deg). Radian angle unit. */
  .frame {
    position: relative;
    width: 300px;
    height: 260px;
    margin: 30px;
    background: #eef2f7;
    border: 2px solid #b0bec5;
  }
  .box {
    position: absolute;
    top: 90px;
    left: 70px;
    width: 160px;
    height: 90px;
    background: #5d4037;
    transform: rotate(0.5236rad);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="box"></div>
  </div>
</body>
</html>
