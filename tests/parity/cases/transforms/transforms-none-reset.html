<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transform none reset</title>
<style>
  @page { size: 457px 261px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* transform: none is an explicit reset — a later rule overriding an
     earlier transform with `none` leaves the box untransformed, exactly in
     its in-flow slot. */
  .frame {
    position: relative;
    width: 320px;
    height: 200px;
    margin: 30px;
    background: #eef2f7;
    border: 2px solid #b0bec5;
  }
  .box {
    position: absolute;
    top: 50px;
    left: 100px;
    width: 120px;
    height: 90px;
    background: #455a64;
    transform: rotate(30deg);
    transform: none;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="box"></div>
  </div>
</body>
</html>
