<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>transform translateX</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* transform: translateX() shifts the box horizontally only */
  .frame {
    position: relative;
    width: 360px;
    height: 200px;
    margin: 30px;
    background: #eef2f7;
    border: 2px solid #b0bec5;
  }
  .guide {
    position: absolute;
    top: 40px;
    left: 20px;
    width: 110px;
    height: 100px;
    background: #cfd8dc;
  }
  .box {
    position: absolute;
    top: 40px;
    left: 20px;
    width: 110px;
    height: 100px;
    background: #00838f;
    transform: translateX(150px);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="guide"></div>
    <div class="box"></div>
  </div>
</body>
</html>
