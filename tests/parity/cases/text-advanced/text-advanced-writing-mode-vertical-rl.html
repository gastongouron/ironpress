<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 60px;
    height: 220px;
    margin: 24px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #fbf0e7;
    font-family: ParitySans;
    font-size: 18px;
    line-height: 1.2;
    color: #4d2a0a;
    writing-mode: vertical-rl;
  }
</style>
</head>
<body>
  <div class="box">VERTICAL</div>
</body>
</html>
