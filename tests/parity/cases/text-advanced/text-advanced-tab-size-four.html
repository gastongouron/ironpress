<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 260px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 12px; }
  .pre {
    border-left: 6px solid #3949ab;
    background: #f3f3ff;
    font-family: ParityMono;
    font-size: 20px;
    line-height: 28px;
    white-space: pre;
    tab-size: 4;
    color: #111111;
  }
</style>
</head>
<body>
  <div class="pre">A	B
A   B</div>
</body>
</html>
