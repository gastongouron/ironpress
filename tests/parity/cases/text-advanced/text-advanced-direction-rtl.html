<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 220px;
    margin: 24px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #fbe7ef;
    font-family: ParitySans;
    font-size: 18px;
    line-height: 1.2;
    color: #4d0a2a;
    direction: rtl;
  }
</style>
</head>
<body>
  <div class="box">alpha beta gamma</div>
</body>
</html>
