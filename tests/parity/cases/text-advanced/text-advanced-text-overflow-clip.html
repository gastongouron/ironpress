<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 265px 86px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 140px;
    margin: 24px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #f0f0e7;
    font-family: ParitySans;
    font-size: 18px;
    line-height: 1.2;
    color: #3a3a0a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }
</style>
</head>
<body>
  <div class="box">clipped overflowing line</div>
</body>
</html>
