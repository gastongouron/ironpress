<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 245px 129px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 120px;
    margin: 24px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #e7f0e7;
    font-family: ParitySans;
    font-size: 18px;
    line-height: 1.2;
    color: #14391a;
    hyphens: auto;
    -webkit-hyphens: auto;
  }
</style>
</head>
<body>
  <div class="box" lang="en">hyphenation participation example</div>
</body>
</html>
