<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 320px;
    margin: 24px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #f0f0e7;
    font-family: ParityMono;
    font-size: 18px;
    line-height: 1.2;
    color: #3a3a0a;
    white-space: pre;
    tab-size: 8;
    -moz-tab-size: 8;
  }
</style>
</head>
<body>
  <div class="box">A	B
CC	D</div>
</body>
</html>
