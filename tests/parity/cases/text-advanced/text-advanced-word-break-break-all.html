<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 130px;
    margin: 24px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #efe7f0;
    font-family: ParityMono;
    font-size: 18px;
    line-height: 1.2;
    color: #3a1448;
    word-break: break-all;
  }
</style>
</head>
<body>
  <div class="box">abcdefghijklmnopqrstuvwxyz</div>
</body>
</html>
