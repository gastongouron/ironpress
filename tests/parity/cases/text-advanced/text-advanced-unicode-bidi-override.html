<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 220px;
    margin: 24px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #e7f0f0;
    font-family: ParityMono;
    font-size: 18px;
    line-height: 1.2;
    color: #0a3a3a;
    direction: rtl;
    unicode-bidi: bidi-override;
  }
</style>
</head>
<body>
  <div class="box">ABCDEF</div>
</body>
</html>
