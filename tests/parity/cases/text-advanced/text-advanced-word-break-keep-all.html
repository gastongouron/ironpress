<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 275px 129px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 150px;
    margin: 24px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #efe7f0;
    font-family: ParitySans;
    font-size: 18px;
    line-height: 1.2;
    color: #3a1448;
    word-break: keep-all;
  }
</style>
</head>
<body>
  <div class="box">keep these whole words intact</div>
</body>
</html>
