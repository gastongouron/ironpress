<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 285px 129px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 160px;
    margin: 24px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #e7f0ef;
    font-family: ParityMono;
    font-size: 18px;
    line-height: 1.2;
    color: #0a3a33;
    white-space: break-spaces;
  }
</style>
</head>
<body>
  <div class="box">alpha    beta gamma delta</div>
</body>
</html>
