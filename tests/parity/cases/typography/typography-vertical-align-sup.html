<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vertical-align sup</title>
<style>
  @page { size: 377px 111px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 260px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #ffe5d9;
  }
  .t {
    font-family: ParitySans;
    font-size: 28px;
    line-height: 1.4;
    color: #6d2e00;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">x<sup>2</sup>y</div>
  </div>
</body>
</html>
