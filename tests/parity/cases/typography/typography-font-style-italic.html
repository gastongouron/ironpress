<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font-style italic</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 320px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #fdffb6;
  }
  .t {
    font-family: serif;
    font-size: 28px;
    font-style: italic;
    line-height: 1;
    color: #5a189a;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Italic style</div>
  </div>
</body>
</html>
