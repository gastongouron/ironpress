<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font-family serif</title>
<style>
  @page { size: 437px 92px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 320px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #e2eafc;
  }
  .t {
    font-family: ParitySerif;
    font-size: 28px;
    line-height: 1;
    color: #001233;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Serif family</div>
  </div>
</body>
</html>
