<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font-size rem</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  html, body { background: #ffffff; }
  .region {
    width: 320px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #ffd6a5;
    font-family: sans-serif;
    font-size: 10px;
  }
  .t {
    font-size: 2rem;
    line-height: 1;
    color: #7c3a00;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Rem scale</div>
  </div>
</body>
</html>
