<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font-size px</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 320px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #f4d35e;
  }
  .t {
    font-family: sans-serif;
    font-size: 32px;
    line-height: 1;
    color: #102a43;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Size 32px</div>
  </div>
</body>
</html>
