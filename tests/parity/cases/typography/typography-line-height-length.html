<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>line-height length</title>
<style>
  @page { size: 377px 172px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 260px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #e9edc9;
  }
  .t {
    font-family: ParitySans;
    font-size: 16px;
    line-height: 36px;
    color: #283618;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Line A</div>
    <div class="t">Line B</div>
    <div class="t">Line C</div>
  </div>
</body>
</html>
