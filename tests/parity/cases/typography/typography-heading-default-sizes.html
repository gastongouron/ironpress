<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>heading default sizes</title>
<style>
  @page { size: 437px 139px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 320px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #fefae0;
    font-family: ParitySans;
    color: #432818;
  }
  h1, h2, h3 { line-height: 1; }
</style>
</head>
<body>
  <div class="region">
    <h1>H1</h1>
    <h2>H2</h2>
    <h3>H3</h3>
  </div>
</body>
</html>
