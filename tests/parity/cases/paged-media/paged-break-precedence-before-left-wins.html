<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>break-before left wins precedence</title><style>
@page{size:160px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.block{width:160px;height:120px;color:#fff;font-size:14px;padding:6px}.a{background:#4f46e5;break-after:right}.b{background:#22c55e;break-before:left}
</style></head><body><div class="block a">A</div><div class="block b">B</div></body></html>
