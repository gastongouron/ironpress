<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 160px 120px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    .block { width: 160px; height: 120px; }
    .first { background: #4f46e5; break-after: left; }
    .second { background: #22c55e; break-before: right; }
    .mark { width: 32px; height: 32px; background: #f8fafc; }
  </style>
</head>
<body>
  <div class="block first"><div class="mark"></div></div>
  <div class="block second"></div>
</body>
</html>
