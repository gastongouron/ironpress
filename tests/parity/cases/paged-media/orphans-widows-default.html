<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* A REAL orphans/widows test. The @page content box (162px tall) fits exactly
     four 36px lines (font-size 24px * line-height 1.5), but the paragraph has
     FIVE lines, so it is taller than one page and is fragmented across two. A
     naive greedy fill would put 4 lines on page 1 and leave a single WIDOW on
     page 2; the initial widows:2 (and orphans:2) forces a line down so each
     fragment keeps >=2 lines. Chrome produces 3 lines on page 1 and 2 on page 2;
     the multi-page harness asserts the page COUNT (2) and diffs both pages. */
  @page { size: 600px 162px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  html { font-family: ParitySans; }
  .para { font-size: 24px; line-height: 1.5; color: #16161d; }
</style>
</head>
<body>
  <p class="para">Default line one<br>Default line two<br>Default line three<br>Default line four<br>Default line five</p>
</body>
</html>
