<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* widows:3 — at least THREE line boxes must be placed at the TOP of the next
     fragment after a break. The @page content box (162px) fits four 36px lines;
     the paragraph has five, so it fragments across two pages. A greedy fill
     would put 4 lines on page 1 and 1 on page 2, but widows:3 forces the break
     to move EARLIER so the continuation starts with >=3 lines: Chrome puts 2
     lines on page 1 and 3 on page 2. The harness asserts the page COUNT (2) and
     diffs both pages. */
  @page { size: 600px 162px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  html { font-family: ParitySans; }
  .para { font-size: 24px; line-height: 1.5; color: #16161d; widows: 3; }
</style>
</head>
<body>
  <p class="para">Widows line one<br>Widows line two<br>Widows line three<br>Widows line four<br>Widows line five</p>
</body>
</html>
