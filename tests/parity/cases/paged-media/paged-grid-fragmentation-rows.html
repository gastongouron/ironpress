<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>paged grid row fragmentation</title><style>
@page{size:160px 140px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.grid{display:grid;grid-template-columns:160px;width:160px}.item{height:50px;border-bottom:2px solid #fff;font-size:12px}.a{background:#ef476f}.b{background:#ffd166}.c{background:#06d6a0}.d{background:#118ab2}.e{background:#a78bfa}.f{background:#f97316}
</style></head><body><div class="grid"><div class="item a">A</div><div class="item b">B</div><div class="item c">C</div><div class="item d">D</div><div class="item e">E</div><div class="item f">F</div></div></body></html>
