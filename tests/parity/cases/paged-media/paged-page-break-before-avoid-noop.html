<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* page-break-before:avoid on content that already fits on one page is a no-op:
     both blocks must remain stacked on the single page. Tracks legacy avoid
     handling without forcing pagination. */
  .block {
    width: 300px;
    height: 110px;
    border: 2px solid #5d2a86;
  }
  .a { background: #b388eb; }
  .b { background: #8338ec; page-break-before: avoid; }
</style>
</head>
<body>
  <div class="block a"></div>
  <div class="block b"></div>
</body>
</html>
