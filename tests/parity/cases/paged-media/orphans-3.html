<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* orphans:3 — at least THREE line boxes must remain at the bottom of a
     fragment before a break. The @page content box (162px) fits four 36px
     lines; the paragraph has five, so it fragments across two pages. With
     orphans:3 (and the default widows:2) the break must leave >=3 lines on
     page 1 and >=2 on page 2: Chrome puts 3 lines on page 1 and 2 on page 2.
     The harness asserts the page COUNT (2) and diffs both pages. */
  @page { size: 600px 162px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  html { font-family: ParitySans; }
  .para { font-size: 24px; line-height: 1.5; color: #16161d; orphans: 3; }
</style>
</head>
<body>
  <p class="para">Orphans line one<br>Orphans line two<br>Orphans line three<br>Orphans line four<br>Orphans line five</p>
</body>
</html>
