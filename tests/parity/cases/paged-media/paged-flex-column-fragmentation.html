<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 160px 140px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    .flex { display: flex; flex-direction: column; width: 160px; background: #f1f5f9; }
    .item { height: 50px; border-bottom: 2px solid #ffffff; color: #111111; font-size: 12px; }
    .a { background: #ef476f; }
    .b { background: #ffd166; }
    .c { background: #06d6a0; }
    .d { background: #118ab2; }
    .e { background: #a78bfa; }
    .f { background: #f97316; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item a">A</div>
    <div class="item b">B</div>
    <div class="item c">C</div>
    <div class="item d">D</div>
    <div class="item e">E</div>
    <div class="item f">F</div>
  </div>
</body>
</html>
