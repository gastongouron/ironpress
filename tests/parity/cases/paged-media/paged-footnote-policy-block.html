<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>footnote policy block</title><style>
@page{size:190px 130px;margin:10px}
html{font-family:ParitySans;line-height:1.5;font-size:12px}
*{margin:0;box-sizing:border-box}
.lead{height:74px;background:#dbeafe}p{line-height:20px;background:#fde68a}.fn{float:footnote;footnote-policy:block}
</style></head><body><div class="lead"></div><p>Paragraph with footnote<span class="fn">large note large note large note large note</span><br>second line</p></body></html>
