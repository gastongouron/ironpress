<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>footnote area max height</title><style>
@page{size:200px 150px;margin:10px}
@footnote{max-height:30px;border-top:2px solid #111}
html{font-family:ParitySans;line-height:1.5;font-size:12px}
*{margin:0;box-sizing:border-box}
.lead{height:80px;background:#bfdbfe}.fn{float:footnote}
</style></head><body><div class="lead"></div><p>Line with note<span class="fn">long note one long note two long note three long note four</span></p></body></html>
