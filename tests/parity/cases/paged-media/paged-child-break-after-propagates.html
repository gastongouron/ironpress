<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>child break-after propagates</title><style>
@page{size:180px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.wrap{padding:10px;background:#fde68a}.child{height:60px;background:#16a34a;break-after:page}.after{height:50px;background:#1d4ed8}
</style></head><body><div class="wrap"><div class="child"></div></div><div class="after"></div></body></html>
