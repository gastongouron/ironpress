<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>named page continuation geometry</title><style>
@page{size:160px 120px;margin:0}
@page chapter{size:160px 100px;margin:20px}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cover{height:120px;background:#1d4ed8;color:#fff;font-size:14px;padding:6px}.chapter{page:chapter;height:220px;background:#16a34a;color:#111;font-size:12px}
</style></head><body><div class="cover">cover</div><div class="chapter">chapter content</div></body></html>
