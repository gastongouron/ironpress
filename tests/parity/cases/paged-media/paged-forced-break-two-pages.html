<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* A REAL pagination test: a forced break puts the second box on page 2, so the
     document is genuinely two pages. The page-1-only comparison could never test
     this; the multi-page harness asserts the page COUNT (2) and diffs BOTH pages. */
  @page { size: 8.5in 11in; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html { font-family: ParitySans; line-height: 1.5; background: #ffffff; }
  .p1 { width: 420px; height: 220px; background: #2d6cdf; border: 4px solid #11305f; }
  .p2 { page-break-before: always; width: 300px; height: 160px; background: #4caf50; border: 4px solid #1b5e20; }
</style>
</head>
<body>
  <div class="p1"></div>
  <div class="p2"></div>
</body>
</html>
