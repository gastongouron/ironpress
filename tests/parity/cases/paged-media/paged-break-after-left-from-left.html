<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>break-after left from left page</title><style>
@page{size:160px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.block{width:160px;height:120px;color:#fff;font-size:14px;padding:6px}.a{background:#1d4ed8}.b{background:#16a34a;break-after:left}.c{background:#f97316}
</style></head><body><div class="block a">A</div><div class="block b">B</div><div class="block c">C</div></body></html>
