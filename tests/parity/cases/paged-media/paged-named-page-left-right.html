<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>named page left right selectors</title><style>
@page{size:180px 120px;margin:0}
@page chapter:left{size:180px 120px;margin-left:40px}
@page chapter:right{size:180px 120px;margin-left:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.cover{height:120px;background:#1d4ed8}.chapter{page:chapter;height:240px;background:#16a34a}
</style></head><body><div class="cover"></div><div class="chapter"></div></body></html>
