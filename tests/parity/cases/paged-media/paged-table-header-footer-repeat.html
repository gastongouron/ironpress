<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 192px 144px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    table { border-collapse: separate; border-spacing: 0; width: 192px; table-layout: fixed; font-size: 10px; line-height: 14px; }
    th, td { height: 24px; border: 0; text-align: center; }
    thead th { background: #26547c; color: #ffffff; }
    tfoot td { background: #ef476f; color: #ffffff; }
    tbody td { background: #ffd166; color: #111111; }
  </style>
</head>
<body>
  <table>
    <thead><tr><th>HEAD</th></tr></thead>
    <tbody>
      <tr><td>row 1</td></tr>
      <tr><td>row 2</td></tr>
      <tr><td>row 3</td></tr>
      <tr><td>row 4</td></tr>
      <tr><td>row 5</td></tr>
      <tr><td>row 6</td></tr>
      <tr><td>row 7</td></tr>
    </tbody>
    <tfoot><tr><td>FOOT</td></tr></tfoot>
  </table>
</body>
</html>
