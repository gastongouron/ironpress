<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* Modern break-before:page on the FIRST block is a no-op (there is no content
     before it to break from), so a single page renders. Tracks the modern
     break-* property family (not parsed by the engine; legacy only). */
  .block {
    width: 300px;
    height: 130px;
    border: 2px solid #0b3d2e;
  }
  .a { background: #06d6a0; break-before: page; }
  .b { background: #118ab2; }
</style>
</head>
<body>
  <div class="block a"></div>
  <div class="block b"></div>
</body>
</html>
