<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 180px 130px; margin: 10px; }
    @footnote { border-top: 4px solid #111111; padding-top: 4px; }
    html { font-family: ParitySans; line-height: 1.5; font-size: 12px; }
    * { margin: 0; box-sizing: border-box; }
    .lead { width: 160px; height: 70px; background: #e0f2fe; }
    p { width: 160px; line-height: 20px; background: #fef3c7; }
    .fn { float: footnote; footnote-display: inline; footnote-policy: line; color: #d00000; }
  </style>
</head>
<body>
  <div class="lead"></div>
  <p>First line stays here<br>Second line has notes<span class="fn">first note</span><span class="fn">second note</span></p>
</body>
</html>
