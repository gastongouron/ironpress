<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 440px 320px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { box-sizing: border-box; }
  html { background: #ffffff; }
  /* The page margin is exercised through an explicit body margin (fixtures may
     not use @page). The content box is inset uniformly by 40px and filled. */
  body { margin: 40px; background: #ffffff; }
  .page-content {
    width: 360px;
    height: 240px;
    background: #2d6cdf;
    border: 4px solid #11305f;
  }
</style>
</head>
<body>
  <div class="page-content"></div>
</body>
</html>
