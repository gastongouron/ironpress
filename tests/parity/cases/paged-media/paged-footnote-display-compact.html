<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>footnote display compact</title><style>
@page{size:220px 140px;margin:10px}
html{font-family:ParitySans;line-height:1.5;font-size:12px}
*{margin:0;box-sizing:border-box}
p{height:70px;background:#fef3c7}.fn{float:footnote;footnote-display:compact}
</style></head><body><p>Text<span class="fn">short one</span> and more text<span class="fn">short two</span>.</p></body></html>
