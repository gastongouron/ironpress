<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* break-inside:avoid keeps a block intact on a single page. Since the content
     already fits, the rendered result equals an unbroken stack; this primarily
     tracks the (modern) break-inside gap. */
  .card {
    break-inside: avoid;
    width: 320px;
    height: 200px;
    background: #ffd166;
    border: 4px solid #b8860b;
  }
  .inner {
    margin: 30px;
    width: 200px;
    height: 100px;
    background: #ef476f;
    border: 2px solid #7a1f33;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="inner"></div>
  </div>
</body>
</html>
