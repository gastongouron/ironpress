<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* page-break-inside:avoid on a table that already fits keeps the whole table
     on the single page. Tracks legacy page-break-inside (a documented gap)
     while staying single-page and geometry-deterministic. */
  table {
    page-break-inside: avoid;
    margin: 24px;
    border-collapse: collapse;
    table-layout: fixed;
    width: 360px;
  }
  td {
    width: 120px;
    height: 60px;
    border: 2px solid #11305f;
  }
  .x { background: #2d6cdf; }
  .y { background: #d8f3dc; }
</style>
</head>
<body>
  <table>
    <tr><td class="x"></td><td class="y"></td><td class="x"></td></tr>
    <tr><td class="y"></td><td class="x"></td><td class="y"></td></tr>
  </table>
</body>
</html>
