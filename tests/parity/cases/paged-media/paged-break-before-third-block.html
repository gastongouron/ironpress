<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Legacy `page-break-before: always` on a MID-document block (the third of
     three). The first two boxes share page 1; the forced break BEFORE the third
     box moves it to page 2. A genuine two-page document proving the legacy
     forced break fires in the middle of the flow. The multi-page harness asserts
     the page COUNT (2) and diffs both pages: page 1 = blue + green, page 2 =
     orange. */
  @page { size: 8.5in 11in; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html { font-family: ParitySans; line-height: 1.5; background: #ffffff; }
  .b1 { width: 420px; height: 200px; background: #2d6cdf; border: 4px solid #11305f; }
  .b2 { width: 360px; height: 180px; background: #4caf50; border: 4px solid #1b5e20; }
  .b3 { page-break-before: always; width: 300px; height: 160px; background: #e08a1e; border: 4px solid #7a4a0c; }
</style>
</head>
<body>
  <div class="b1"></div>
  <div class="b2"></div>
  <div class="b3"></div>
</body>
</html>
