<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>child break-before propagates</title><style>
@page{size:180px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.top{height:80px;background:#1d4ed8}.wrap{padding:10px;background:#fde68a}.child{height:60px;background:#16a34a;break-before:page}
</style></head><body><div class="top"></div><div class="wrap"><div class="child"></div></div></body></html>
