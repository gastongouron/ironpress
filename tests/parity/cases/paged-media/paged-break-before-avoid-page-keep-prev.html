<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>break-before avoid-page keeps previous</title><style>
@page{size:180px 120px;margin:0}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.spacer{height:75px;background:#dbeafe}.head{height:25px;background:#ef476f;font-size:12px}.para{height:35px;background:#06d6a0;break-before:avoid-page;font-size:12px}
</style></head><body><div class="spacer"></div><div class="head">HEAD</div><div class="para">PARA</div></body></html>
