<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>page selector list named pages</title><style>
@page{size:180px 120px;margin:0}
@page title, chapter{size:180px 120px;margin-left:40px}
html{font-family:ParitySans;line-height:1.5}
*{margin:0;box-sizing:border-box}
.title{page:title;height:120px;background:#ffd166}.chapter{page:chapter;height:120px;background:#118ab2}
</style></head><body><div class="title"></div><div class="chapter"></div></body></html>
