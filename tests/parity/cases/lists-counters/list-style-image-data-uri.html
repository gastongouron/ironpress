<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>list-style-image data-uri</title>
<style>
  @page { size: 477px 169px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 16px 16px 16px 48px;
    border: 2px solid #000000;
    background: #fce4ec;
  }
  ul {
    list-style-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFklEQVR42mM4ISdHEmIY1TCqYfhqAADkYgQQ6ZuA8QAAAABJRU5ErkJggg==");
    list-style-position: outside;
  }
  li {
    font-family: ParitySans;
    font-size: 22px;
    line-height: 1.4;
    color: #1b1b1b;
  }
</style>
</head>
<body>
  <div class="region">
    <ul>
      <li>Image bullet one</li>
      <li>Image bullet two</li>
      <li>Image bullet three</li>
    </ul>
  </div>
</body>
</html>
