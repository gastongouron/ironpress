<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>list-style-type disc</title>
<style>
  @page { size: 477px 169px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 16px 16px 16px 48px;
    border: 2px solid #000000;
    background: #e8f5e9;
  }
  ul {
    list-style-type: disc;
  }
  li {
    font-family: ParitySans;
    font-size: 22px;
    line-height: 1.4;
    color: #1b1b1b;
  }
</style>
</head>
<body>
  <div class="region">
    <ul>
      <li>Alpha item</li>
      <li>Beta item</li>
      <li>Gamma item</li>
    </ul>
  </div>
</body>
</html>
