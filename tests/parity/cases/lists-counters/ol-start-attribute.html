<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ol start attribute</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 16px 16px 16px 56px;
    border: 2px solid #000000;
    background: #fce4ec;
  }
  ol {
    list-style-type: decimal;
  }
  li {
    font-family: ParitySans;
    font-size: 22px;
    line-height: 1.4;
    color: #1b1b1b;
  }
</style>
</head>
<body>
  <div class="region">
    <ol start="5">
      <li>Fifth item</li>
      <li>Sixth item</li>
      <li>Seventh item</li>
    </ol>
  </div>
</body>
</html>
