<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>list-style-type decimal-leading-zero</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 16px 16px 16px 56px;
    border: 2px solid #000000;
    background: #e8f5e9;
  }
  ol {
    list-style-type: decimal-leading-zero;
  }
  li {
    font-family: ParitySans;
    font-size: 22px;
    line-height: 1.4;
    color: #1b1b1b;
  }
</style>
</head>
<body>
  <div class="region">
    <ol>
      <li>Zero one</li>
      <li>Zero two</li>
      <li>Zero three</li>
    </ol>
  </div>
</body>
</html>
