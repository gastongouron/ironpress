<!DOCTYPE html><html><head><meta charset='utf-8'><style>@page{size:330px 160px;margin:0}html{font-family:ParitySans;line-height:1.5}*{margin:0;box-sizing:border-box}@counter-style negwrap{system:extends decimal;negative:'(' ')';suffix:' '}body{padding:12px;background:#fff;counter-reset:n -3}.row{counter-increment:n;font-size:22px;line-height:32px;background:#fff3e0;margin-bottom:4px}.row::before{content:counter(n,negwrap);color:#d7263d;font-weight:bold}</style></head><body><div class='row'>minus two</div><div class='row'>minus one</div><div class='row'>zero</div></body></html>
