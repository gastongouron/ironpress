<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>list-style-type none</title>
<style>
  @page { size: 477px 169px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 16px;
    border: 2px solid #000000;
    background: #ede7f6;
  }
  ul {
    list-style-type: none;
  }
  li {
    font-family: ParitySans;
    font-size: 22px;
    line-height: 1.4;
    color: #1b1b1b;
  }
</style>
</head>
<body>
  <div class="region">
    <ul>
      <li>No marker one</li>
      <li>No marker two</li>
      <li>No marker three</li>
    </ul>
  </div>
</body>
</html>
