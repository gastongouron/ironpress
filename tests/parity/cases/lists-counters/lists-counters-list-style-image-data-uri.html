<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 300px 190px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 18px; }
  .region {
    width: 240px;
    padding: 10px 10px 10px 46px;
    border: 2px solid #111111;
    background: #fce4ec;
  }
  ul {
    padding-left: 28px;
    font-family: ParitySans;
    font-size: 20px;
    line-height: 30px;
    list-style-position: outside;
    list-style-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAFklEQVR42mM4ISdHEmIY1TCqYfhqAADkYgQQ6ZuA8QAAAABJRU5ErkJggg==");
  }
  li {
    margin-bottom: 4px;
    color: #111111;
  }
</style>
</head>
<body>
  <div class="region">
    <ul>
      <li>Alpha</li>
      <li>Beta</li>
      <li>Gamma</li>
    </ul>
  </div>
</body>
</html>
