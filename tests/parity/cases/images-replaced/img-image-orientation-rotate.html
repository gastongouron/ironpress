<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 140px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .slot {
    width: 90px;
    height: 90px;
    background: #c62828;
  }
  .slot img {
    display: block;
    width: 90px;
    height: 90px;
    object-fit: contain;
    image-orientation: 90deg;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
  <div class="slot">
    <img alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAECAIAAAA8r+mnAAAAFUlEQVR42mM4pqEBR1z1enDEQD0JAMyPHNFwKtUxAAAAAElFTkSuQmCC">
  </div>
</body>
</html>
