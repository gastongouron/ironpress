<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>inline svg text</title>
<style>
  @page { size: 417px 141px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage {
    width: 280px;
    margin: 30px;
    background: #eeeeee;
  }
  svg { display: block; }
</style>
</head>
<body>
  <div class="stage">
    <svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="240" height="80" fill="#d8f3dc"></rect>
      <text x="16" y="52" font-family="ParitySans" font-size="36" fill="#081c15">SVG TEXT</text>
    </svg>
  </div>
</body>
</html>
