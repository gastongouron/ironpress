<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>svg text letter-spacing ligatures</title>
<style>
  @page { size: 344px 160px; margin: 0; }
  html { font-family: ParitySerif; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  svg { display: block; }
</style>
</head>
<body>
  <svg width="344" height="160" viewBox="0 0 344 160" xmlns="http://www.w3.org/2000/svg">
    <text x="16" y="56" font-family="ParitySerif" font-size="40" fill="#111111">office fifl</text>
    <text x="16" y="128" font-family="ParitySerif" font-size="40" fill="#111111" letter-spacing="6">office fifl</text>
  </svg>
</body>
</html>
