<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 140px 110px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .slot {
    width: 90px;
    height: 70px;
    overflow: hidden;
    background: #c62828;
  }
  .slot img {
    display: block;
    width: 90px;
    height: 70px;
    object-fit: cover;
    object-position: right 25% bottom 25%;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
  <div class="slot">
    <img alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAECAIAAAA8r+mnAAAAFUlEQVR42mM4pqEBR1z1enDEQD0JAMyPHNFwKtUxAAAAAElFTkSuQmCC">
  </div>
</body>
</html>
