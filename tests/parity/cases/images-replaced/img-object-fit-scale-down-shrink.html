<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>img object-fit scale-down (contain wins)</title>
<style>
  @page { size: 377px 221px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 240px; margin: 30px; background: #eeeeee; }
  /* 240x120 (2:1) image larger than the 160x160 box: scale-down behaves like
     contain, shrinking it to 160x80 centred (grey bands top and bottom). */
  img {
    display: block; width: 160px; height: 160px; background: #cccccc;
    object-fit: scale-down; image-rendering: pixelated;
  }
</style>
</head>
