<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>svg text letter-spacing anchors</title>
<style>
  @page { size: 344px 192px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  svg { display: block; }
</style>
</head>
<body>
  <svg width="344" height="192" viewBox="0 0 344 192" xmlns="http://www.w3.org/2000/svg">
    <line x1="16" y1="16" x2="16" y2="176" stroke="#cc0000" stroke-width="1"></line>
    <line x1="172" y1="16" x2="172" y2="176" stroke="#cc0000" stroke-width="1"></line>
    <line x1="328" y1="16" x2="328" y2="176" stroke="#cc0000" stroke-width="1"></line>
    <text x="16" y="56" font-family="ParitySans" font-size="32" fill="#111111" letter-spacing="8" text-anchor="start">Anchor</text>
    <text x="172" y="112" font-family="ParitySans" font-size="32" fill="#111111" letter-spacing="8" text-anchor="middle">Anchor</text>
    <text x="328" y="168" font-family="ParitySans" font-size="32" fill="#111111" letter-spacing="8" text-anchor="end">Anchor</text>
  </svg>
</body>
</html>
