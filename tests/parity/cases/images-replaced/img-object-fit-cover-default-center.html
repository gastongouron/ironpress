<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>img object-fit cover default centering</title>
<style>
  @page { size: 377px 220px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 240px; margin: 30px; background: #eeeeee; }
  /* cover scales the 2:1 image to 320x160 to fill the 160x160 box; with the
     default object-position 50% 50% the overflow is split evenly left/right so
     the central vertical strip (straddling the red|green and blue|yellow seam)
     is shown. */
  img {
    display: block; width: 160px; height: 160px; background: #cccccc;
    object-fit: cover; image-rendering: pixelated;
  }
</style>
</head>
<body>
  <div class="stage">
    <img alt="" width="160" height="160" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAECAIAAAA8r+mnAAAAIElEQVR42mM4IScHR3I9NnDEgFNCzu0EHN1ZJQJHOCUAni4lgeO2HLIAAAAASUVORK5CYII=">
  </div>
</body>
</html>
