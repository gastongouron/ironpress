<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>img taller than page sliced across pages</title>
<style>
  @page { size: 300px 240px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* A 280x520px raster image is taller than the 300x240px page content box, so
     it must be SLICED across 3 pages: each page shows a 280x(~240px) vertical
     band of the source gradient. The vertical red->blue gradient plus the 20px
     horizontal stripe bands make every slice boundary unambiguous. */
  img {
    display: block;
    width: 280px;
    height: 520px;
  }
</style>
