<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>img intrinsic natural size</title>
<style>
  @page { size: 337px 64px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 200px; margin: 30px; background: #eeeeee; }
  /* No width/height attribute and no CSS sizing: the image uses its intrinsic
     8x4 px natural dimensions (default sizing algorithm, no-dimensions branch). */
  img { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
  <div class="stage">
    <img alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAECAIAAAA8r+mnAAAAIElEQVR42mM4IScHR3I9NnDEgFNCzu0EHN1ZJQJHOCUAni4lgeO2HLIAAAAASUVORK5CYII=">
  </div>
</body>
</html>
