<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 260px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .track {
    position: relative;
    width: 220px;
    height: 90px;
    background: #c62828;
  }
  .target {
    position: absolute;
    left: 10px;
    top: 15px;
    width: 50px;
    height: 35px;
    padding: 10px;
    border: 5px solid #1565c0;
    background: #0a7f2e;
    transform-box: border-box;
    transform: translateX(100%);
  }
</style>
</head>
<body>
  <div class="track"><div class="target"></div></div>
</body>
</html>
