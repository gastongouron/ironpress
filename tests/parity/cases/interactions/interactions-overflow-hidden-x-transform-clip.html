<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 190px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 120px;
    height: 80px;
    overflow: hidden;
    background: #c62828;
  }
  .child {
    width: 90px;
    height: 60px;
    background: #0a7f2e;
    transform: translate(55px, 30px);
  }
</style>
</head>
<body>
  <div class="box"><div class="child"></div></div>
</body>
</html>
