<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 377px 261px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* interaction: the containing block has padding; for an absolutely
     positioned child, the containing block is the PADDING box of the
     positioned ancestor, so top/left are measured from inside the padding. */
  .cb {
    position: relative;
    width: 260px;
    height: 220px;
    padding: 40px;
    background: #e9f0f4;
    border: 2px solid #15324f;
  }
  .box {
    position: absolute;
    top: 0;
    left: 0;
    width: 110px;
    height: 80px;
    background: #2980b9;
    border: 2px solid #15324f;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cb">
      <div class="box"></div>
    </div>
  </div>
</body>
</html>
