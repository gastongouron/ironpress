<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>z-index x transforms: stacking order across positioned and transformed boxes</title>
<style>
  @page { size: 437px 261px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage {
    position: relative;
    width: 300px;
    height: 200px;
    margin: 30px;
    border: 2px solid #222222;
    background: #f1f5f9;
  }
  /* Three overlapping boxes. The transform creates a stacking context, but
     explicit z-index still determines paint order: the high-z transformed box
     must paint on top of the lower-z plain positioned boxes. */
  .back {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 120px;
    height: 120px;
    z-index: 1;
    border: 2px solid #166534;
    background: #86efac;
  }
  .mid {
    position: absolute;
    top: 50px;
    left: 70px;
    width: 120px;
    height: 120px;
    z-index: 2;
    border: 2px solid #1e3a8a;
    background: #93c5fd;
  }
  .front {
    position: absolute;
    top: 35px;
    left: 120px;
    width: 110px;
    height: 110px;
    z-index: 3;
    transform: rotate(12deg);
    transform-origin: center center;
    border: 2px solid #b91c1c;
    background: #fca5a5;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="back"></div>
    <div class="mid"></div>
    <div class="front"></div>
  </div>
</body>
</html>
