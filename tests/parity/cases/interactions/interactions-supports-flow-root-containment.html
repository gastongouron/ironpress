<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 210px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 150px;
    background: #d9d9d9;
  }
  .float {
    float: left;
    width: 90px;
    height: 55px;
    background: #1565c0;
  }
  .after {
    width: 150px;
    height: 30px;
    background: #c62828;
  }
  @supports (display: flow-root) {
    .box {
      display: flow-root;
      background: #0a7f2e;
    }
  }
</style>
</head>
<body>
  <div class="box"><div class="float"></div></div>
  <div class="after"></div>
</body>
</html>
