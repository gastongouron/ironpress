<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 438px 235px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* interaction: a left float beside a block whose adjacent vertical margins
     collapse. The float is taken out of flow; the in-flow blocks' margins
     between them collapse to the larger value. */
  .container {
    width: 320px;
    background: #eef4ec;
    border: 2px solid #6e6e6e;
  }
  .float {
    float: left;
    width: 90px;
    height: 90px;
    background: #16a085;
    border: 2px solid #0a4d40;
  }
  .a {
    margin: 30px 0;
    height: 50px;
    background: #c0392b;
    border: 2px solid #6e2018;
  }
  .b {
    margin: 30px 0;
    height: 50px;
    background: #2980b9;
    border: 2px solid #15324f;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <div class="float"></div>
      <div class="a"></div>
      <div class="b"></div>
    </div>
  </div>
</body>
</html>
