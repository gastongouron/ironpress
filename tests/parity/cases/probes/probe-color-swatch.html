<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>probe color swatch</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* Substrate canary: a pure background-color rectangle.
     Tests background-color paint in isolation. */

    width: 200px;
    height: 200px;
    background-color: #c62828;
  }
</style>
</head>
<body>
  <div class="swatch"></div>
</body>
