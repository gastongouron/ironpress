<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 280px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #f2e8ee;
    font-family: sans-serif;
    font-size: 18px;
    color: #3a1a2a;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="box">centered text</div>
</body>
</html>
