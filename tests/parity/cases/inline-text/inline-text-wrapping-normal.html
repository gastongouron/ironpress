<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 257px 137px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 140px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #eaeef5;
    font-family: ParityMono;
    font-size: 16px;
    color: #102a43;
    line-height: 20px;
  }
</style>
</head>
<body>
  <div class="box">one two three four five six seven</div>
</body>
</html>
