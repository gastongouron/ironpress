<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 360px;
    margin: 20px;
    padding: 8px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: monospace;
    font-size: 20px;
    color: #1a1a1a;
    white-space: nowrap;
    letter-spacing: -2px;
  }
</style>
</head>
<body>
  <!-- Negative letter-spacing tightens the gap between glyphs (css-text-3 §8.2). -->
  <div class="box">TIGHTSPACING</div>
</body>
</html>
