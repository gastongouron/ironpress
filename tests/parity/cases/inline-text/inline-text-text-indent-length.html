<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 377px 157px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 260px;
    margin: 20px;
    padding: 8px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: ParitySans;
    font-size: 16px;
    color: #1a1a1a;
    text-indent: 40px;
  }
</style>
</head>
<body>
  <!-- text-indent shifts only the FIRST formatted line (css-text-3 §8). -->
  <div class="box">The first line is indented while the remaining wrapped lines start at the left edge of the content box.</div>
</body>
</html>
