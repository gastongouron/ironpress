<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 478px 115px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .line {
    margin: 20px;
    padding: 8px;
    width: 360px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: ParitySans;
    font-size: 18px;
    color: #1a1a1a;
  }
  /* An inline-block with MULTIPLE in-flow lines aligns its LAST line's
     baseline to the surrounding text baseline (CSS2 §10.8.1). */
  .ib {
    display: inline-block;
    width: 70px;
    background: #d8e4f2;
    border: 2px solid #2a4a8a;
    padding: 4px;
    font-size: 14px;
    color: #16294f;
  }
</style>
</head>
<body>
  <div class="line">Text <span class="ib">one two three</span> Text</div>
</body>
</html>
