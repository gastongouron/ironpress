<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap {
    width: 260px;
    margin: 20px;
    border: 2px solid #1a1a1a;
    background: #eef3fb;
    font-family: sans-serif;
    font-size: 16px;
    color: #102a43;
  }
  .wrap p {
    line-height: 2;
    background: #c3d9f5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <p>Line one of text.</p>
    <p>Line two of text.</p>
    <p>Line three of text.</p>
  </div>
</body>
</html>
