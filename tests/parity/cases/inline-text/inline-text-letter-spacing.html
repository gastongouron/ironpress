<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 417px 87px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 300px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #f5efe2;
    font-family: ParityMono;
    font-size: 20px;
    color: #4a3410;
    letter-spacing: 8px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="box">SPACED</div>
</body>
</html>
