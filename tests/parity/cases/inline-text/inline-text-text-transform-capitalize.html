<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 300px;
    margin: 20px;
    padding: 8px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: sans-serif;
    font-size: 18px;
    color: #1a1a1a;
    text-transform: capitalize;
  }
</style>
</head>
<body>
  <!-- text-transform:capitalize upper-cases the first letter of each word
       (css-text-3 §2.1). -->
  <div class="box">the quick brown fox jumps</div>
</body>
</html>
