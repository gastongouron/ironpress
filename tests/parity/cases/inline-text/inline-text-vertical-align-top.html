<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .line {
    margin: 20px;
    padding: 8px;
    width: 280px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: sans-serif;
    font-size: 18px;
    line-height: 40px;
    color: #1a1a1a;
  }
  .box {
    display: inline-block;
    width: 28px;
    height: 28px;
    background: #2a4a8a;
    border: 2px solid #16294f;
    vertical-align: top;
  }
</style>
</head>
<body>
  <div class="line">Ax<span class="box"></span>yQ</div>
</body>
</html>
