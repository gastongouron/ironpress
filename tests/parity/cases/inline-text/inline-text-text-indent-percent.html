<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 300px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 10px; }
  p {
    width: 220px;
    font-family: ParitySans;
    font-size: 18px;
    line-height: 24px;
    text-indent: 50%;
    background: #edf7ed;
    border-left: 4px solid #2e7d32;
    color: #111111;
  }
</style>
</head>
<body>
  <p>First line starts halfway across. Later wrapped lines return to the left edge.</p>
</body>
</html>
