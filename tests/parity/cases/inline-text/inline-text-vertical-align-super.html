<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .line {
    margin: 20px;
    padding: 8px;
    width: 300px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: sans-serif;
    font-size: 22px;
    color: #1a1a1a;
  }
  /* vertical-align:super raises the box above the baseline (CSS2 §10.8.1). */
  .box {
    display: inline-block;
    width: 24px;
    height: 24px;
    background: #8a2a6a;
    border: 2px solid #54143e;
    vertical-align: super;
  }
</style>
</head>
<body>
  <div class="line">Ax<span class="box"></span>yQ</div>
</body>
</html>
