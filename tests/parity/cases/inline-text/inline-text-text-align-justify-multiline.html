<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 280px;
    margin: 20px;
    padding: 8px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: sans-serif;
    font-size: 16px;
    color: #1a1a1a;
    text-align: justify;
  }
</style>
</head>
<body>
  <!-- text-align:justify stretches inter-word spacing so every non-last line
       reaches both edges (css-text-3 §7.3). -->
  <div class="box">Justified text stretches the spaces between words so that each full line touches both the left and the right edge of the box.</div>
</body>
</html>
