<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 260px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #f2f2e8;
    font-family: sans-serif;
    font-size: 20px;
    color: #1a1a1a;
  }
  .box span {
    text-decoration: underline;
    text-decoration-color: #b00020;
    text-decoration-thickness: 2px;
  }
</style>
</head>
<body>
  <div class="box"><span>underlined</span></div>
</body>
</html>
