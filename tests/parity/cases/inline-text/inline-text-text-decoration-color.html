<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 320px;
    margin: 20px;
    padding: 8px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: sans-serif;
    font-size: 20px;
    color: #1a1a1a;
  }
  /* text-decoration-color sets a line colour distinct from the text colour
     (css-text-decor-3 §2.2). */
  .deco {
    text-decoration: underline;
    text-decoration-color: #cc2222;
  }
</style>
</head>
<body>
  <div class="box">A <span class="deco">red underline</span> here</div>
</body>
</html>
