<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 337px 129px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 220px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #e7eff0;
    font-family: ParitySans;
    font-size: 16px;
    color: #103a3f;
    white-space: pre-line;
  }
</style>
</head>
<body>
  <!-- pre-line collapses spaces like normal but PRESERVES newlines as forced
       breaks (css-text-3 §4.1.1). -->
  <div class="box">alpha    beta
gamma delta
epsilon</div>
</body>
</html>
