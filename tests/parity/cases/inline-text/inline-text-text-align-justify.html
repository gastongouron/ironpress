<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 337px 105px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 220px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #e8f2ec;
    font-family: ParitySerif;
    font-size: 16px;
    color: #143a2a;
    text-align: justify;
  }
</style>
</head>
<body>
  <div class="box">one two three four five six seven eight nine ten</div>
</body>
</html>
