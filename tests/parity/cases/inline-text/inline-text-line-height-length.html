<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 358px 157px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 240px;
    margin: 20px;
    padding: 8px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: ParitySans;
    font-size: 16px;
    color: #1a1a1a;
    line-height: 32px;
  }
</style>
</head>
<body>
  <!-- line-height as a length sets a fixed line-box height (CSS2 §10.8). -->
  <div class="box">First wrapped line of text here. Second wrapped line of text here too.</div>
</body>
</html>
