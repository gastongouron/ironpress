<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 318px 105px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #e7eff0;
    font-family: ParitySans;
    font-size: 16px;
    color: #103a3f;
    white-space: normal;
  }
</style>
</head>
<body>
  <!-- normal collapses runs of spaces/newlines to a single space and wraps
       at the box edge (css-text-3 §4.1.1). -->
  <div class="box">alpha    beta
    gamma     delta epsilon zeta</div>
</body>
</html>
