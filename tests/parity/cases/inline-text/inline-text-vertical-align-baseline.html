<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 398px 94px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .line {
    margin: 20px;
    padding: 8px;
    width: 280px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: ParitySans;
    font-size: 18px;
    color: #1a1a1a;
  }
  .box {
    display: inline-block;
    width: 28px;
    height: 28px;
    background: #2a7a2a;
    border: 2px solid #145214;
    vertical-align: baseline;
  }
</style>
</head>
<body>
  <div class="line">Ax<span class="box"></span>yQ</div>
</body>
</html>
