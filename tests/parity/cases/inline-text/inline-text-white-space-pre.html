<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 358px 129px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 240px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #efe7f0;
    font-family: ParityMono;
    font-size: 16px;
    color: #3a1448;
    white-space: pre;
  }
</style>
</head>
<body>
  <div class="box">A   B   C
D       E
F</div>
</body>
</html>
