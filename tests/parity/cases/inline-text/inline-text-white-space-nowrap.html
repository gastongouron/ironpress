<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 238px 81px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 120px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #e7f0e7;
    font-family: ParitySans;
    font-size: 16px;
    color: #14391a;
    white-space: nowrap;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="box">one two three four five</div>
</body>
</html>
