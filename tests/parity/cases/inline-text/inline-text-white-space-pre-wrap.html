<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 267px 129px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 150px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #e7eff0;
    font-family: ParityMono;
    font-size: 16px;
    color: #103a3f;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <div class="box">alpha    beta gamma delta epsilon</div>
</body>
</html>
