<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 417px 91px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 300px;
    margin: 20px;
    padding: 8px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: ParitySans;
    font-size: 20px;
    color: #1a1a1a;
  }
  .strike { text-decoration: line-through; }
</style>
</head>
<body>
  <!-- text-decoration-line:line-through draws a line through the text
       (css-text-decor-3 §2.1). -->
  <div class="box">Price <span class="strike">old value</span> new</div>
</body>
</html>
