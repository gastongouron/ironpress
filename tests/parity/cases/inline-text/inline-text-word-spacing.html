<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 320px;
    margin: 20px;
    padding: 6px;
    border: 2px solid #1a1a1a;
    background: #eef0e2;
    font-family: monospace;
    font-size: 18px;
    color: #2f3a10;
    word-spacing: 20px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="box">one two three</div>
</body>
</html>
