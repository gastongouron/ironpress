<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 417px 111px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .line {
    margin: 20px;
    padding: 8px;
    width: 300px;
    border: 2px solid #1a1a1a;
    background: #f2f2f2;
    font-family: ParitySans;
    font-size: 18px;
    color: #1a1a1a;
  }
  /* An inline-block with in-flow content aligns its last line's baseline
     to the surrounding text baseline. */
  .ib {
    display: inline-block;
    width: 60px;
    height: 50px;
    padding-top: 24px;
    background: #d8e4f2;
    border: 2px solid #2a4a8a;
    font-size: 16px;
    color: #16294f;
  }
</style>
</head>
<body>
  <div class="line">Text <span class="ib">bb</span> Text</div>
</body>
</html>
