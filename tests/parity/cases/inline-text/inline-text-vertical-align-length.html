<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 260px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 24px; font-size: 32px; }
  .line {
    height: 70px;
    border-top: 2px solid #222222;
    background: #eef2ff;
    color: #111111;
  }
  .box {
    display: inline-block;
    width: 28px;
    height: 28px;
    background: #d7263d;
    vertical-align: 18px;
  }
</style>
</head>
<body>
  <div class="line">A<span class="box"></span>B</div>
</body>
</html>
