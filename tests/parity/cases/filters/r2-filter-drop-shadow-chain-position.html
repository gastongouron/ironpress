<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 filter drop shadow chain position</title>
<style>
  @page { size: 230px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 230px; height: 120px; padding: 30px; background: #ffffff; }
  .box { width: 70px; height: 50px; background: #ffca28; filter: drop-shadow(82px 0 0 #303030) brightness(2); }
</style>
</head>
<body>
  <div class="stage"><div class="box"></div></div>
</body>
</html>
