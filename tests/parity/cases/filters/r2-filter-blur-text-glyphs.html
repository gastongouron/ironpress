<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 filter blur text glyphs</title>
<style>
  @page { size: 240px 110px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .text { width: 240px; height: 110px; padding: 20px; color: #111111; font-size: 52px; font-weight: 700; line-height: 60px; filter: blur(3px); }
</style>
</head>
<body>
  <div class="text">TEXT</div>
</body>
</html>
