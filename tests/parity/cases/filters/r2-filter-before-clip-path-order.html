<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 filter before clip path order</title>
<style>
  @page { size: 170px 170px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 170px; height: 170px; padding: 25px; background: #ffffff; }
  .box { width: 120px; height: 120px; background: #d32f2f; filter: blur(10px); clip-path: circle(46px at 60px 60px); }
</style>
</head>
<body>
  <div class="stage"><div class="box"></div></div>
</body>
</html>
