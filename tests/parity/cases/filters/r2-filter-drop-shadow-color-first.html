<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 filter drop shadow color first</title>
<style>
  @page { size: 220px 110px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 220px; height: 110px; padding: 25px; background: #ffffff; }
  .box { width: 70px; height: 60px; background: #ffca28; filter: drop-shadow(#00695c 88px 0 0); }
</style>
</head>
<body>
  <div class="stage"><div class="box"></div></div>
</body>
</html>
