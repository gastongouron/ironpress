<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 filter drop shadow rounded css alpha</title>
<style>
  @page { size: 220px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 220px; height: 140px; padding: 30px; background: #ffffff; }
  .ball { width: 80px; height: 80px; border-radius: 50%; background: #d32f2f; filter: drop-shadow(76px 0 0 #424242); }
</style>
</head>
<body>
  <div class="stage"><div class="ball"></div></div>
</body>
</html>
