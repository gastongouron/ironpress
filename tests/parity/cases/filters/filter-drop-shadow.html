<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>filter drop-shadow on alpha image</title>
<style>
  @page { size: 337px 260px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* Padding so the offset drop-shadow stays on-page. */
  .frame { padding: 40px; }
  img.t {
    width: 160px;
    height: 160px;
    image-rendering: pixelated;
    /* zero blur -> hard-edged shadow tracing the diamond alpha, not its box */
    filter: drop-shadow(20px 20px 0 #424242);
  }
</style>
</head>
