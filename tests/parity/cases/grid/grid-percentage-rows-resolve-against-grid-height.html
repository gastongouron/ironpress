<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>percentage-rows-resolve-against-grid-height</title>
<style>
  @page { size: 220px 230px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: 120px;
    grid-template-rows: 25% 75%;
    width: 120px;
    height: 160px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
  }
  .b {
    background: #1b998b;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div></div>
</body>
</html>
