<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>template-areas-create-implicit-tracks-when-track-lists-are-omitted</title>
<style>
  @page { size: 250px 170px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-areas: "a b" "c d";
    grid-auto-columns: 80px;
    grid-auto-rows: 50px;
    width: 160px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    grid-area: a;
    background: #d7263d;
  }
  .b {
    grid-area: b;
    background: #1b998b;
  }
  .c {
    grid-area: c;
    background: #f4d35e;
  }
  .d {
    grid-area: d;
    background: #5a3fff;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div></div>
</body>
</html>
