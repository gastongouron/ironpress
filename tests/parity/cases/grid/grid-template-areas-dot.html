<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid template areas with dot</title>
<style>
  @page { size: 328px 181px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: 70px 70px 70px;
    grid-template-rows: 70px 70px;
    grid-template-areas:
      "a a ."
      ". b b";
    width: 210px;
    height: 140px;
    margin: 20px;
  }
  .a { background: #ff5a5f; grid-area: a; }
  .b { background: #2ec4b6; grid-area: b; }
</style>
</head>
<body>
  <div class="grid">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
