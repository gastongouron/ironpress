<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>direct-text-creates-anonymous-grid-items</title>
<style>
  @page { size: 300px 130px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: 70px 70px 70px;
    grid-template-rows: 60px;
    width: 210px;
    margin: 20px;
    border: 2px solid #000000;
    font-size: 20px;
  }
  .a {
    background: #d7263d;
  }
  .b {
    background: #1b998b;
    color: #fff;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div>TXT<div class="b">B</div></div>
</body>
</html>
