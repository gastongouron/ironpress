<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid implicit tracks</title>
<style>
  @page { size: 279px 222px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: 80px 80px;
    grid-auto-rows: 60px;
    width: 160px;
    height: 180px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .cell { border: 2px solid #003a8c; }
  .a { background: #ff5a5f; }
  .b { background: #2ec4b6; }
  .c { background: #ffbf00; }
  .d { background: #5a3fff; }
  .e { background: #ff8c42; }
  .f { background: #1d3557; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell a"></div>
    <div class="cell b"></div>
    <div class="cell c"></div>
    <div class="cell d"></div>
    <div class="cell e"></div>
    <div class="cell f"></div>
  </div>
</body>
</html>
