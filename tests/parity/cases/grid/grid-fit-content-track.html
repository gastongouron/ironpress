<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid-fit-content-track</title>
<style>
  @page { size: 440px 160px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: fit-content(120px) 1fr;
    grid-template-rows: 90px;
    width: 360px;
    margin: 20px;
    border: 2px solid #000000;
    font-size: 20px;
  }
  .a { background: #d7263d; color: #ffffff; padding: 6px; }
  .b { background: #1b998b; }
</style>
</head>
<body>
  <div class="grid">
    <div class="a">alpha beta gamma delta</div>
    <div class="b"></div>
  </div>
</body>
</html>
