<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid-invalid-template-areas</title>
<style>
  @page { size: 220px 190px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: 70px 70px;
    grid-template-rows: 60px 60px;
    grid-template-areas:
      "a a"
      "a b";
    width: 140px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a { background: #d7263d; grid-area: a; }
  .b { background: #1b998b; grid-area: b; }
</style>
</head>
<body>
  <div class="grid">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
