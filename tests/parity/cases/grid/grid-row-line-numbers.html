<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid row line numbers</title>
<style>
  @page { size: 238px 191px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: 120px;
    grid-template-rows: 50px 50px 50px;
    width: 120px;
    height: 150px;
    margin: 20px;
  }
  .a { background: #ff5a5f; grid-row: 1 / 3; }
  .b { background: #2ec4b6; grid-row: 3 / 4; }
</style>
</head>
<body>
  <div class="grid">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
