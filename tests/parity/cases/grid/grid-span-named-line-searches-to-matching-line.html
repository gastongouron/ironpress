<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>span-named-line-searches-to-matching-line</title>
<style>
  @page { size: 260px 130px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: [left] 60px 60px [right] 60px;
    width: 180px;
    grid-template-rows: 60px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
    grid-column: left / span right;
  }
  .b {
    background: #1b998b;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div></div>
</body>
</html>
