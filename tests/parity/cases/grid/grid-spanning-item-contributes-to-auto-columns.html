<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>spanning-item-contributes-to-auto-columns</title>
<style>
  @page { size: 380px 150px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: auto auto 60px;
    grid-template-rows: 50px 50px;
    width: 300px;
    margin: 20px;
    border: 2px solid #000000;
    font-size: 18px;
  }
  .wide {
    grid-column: 1 / 3;
    background: #d7263d;
    color: #fff;
    white-space: nowrap;
  }
  .tail {
    background: #1b998b;
  }
  .last {
    background: #f4d35e;
  }
</style>
</head>
<body>
<div class="grid"><div class="wide">wide spanning label</div><div class="tail"></div><div class="last"></div></div>
</body>
</html>
