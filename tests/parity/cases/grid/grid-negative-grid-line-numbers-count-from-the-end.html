<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>negative-grid-line-numbers-count-from-the-end</title>
<style>
  @page { size: 280px 130px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: 50px 50px 50px 50px;
    grid-template-rows: 60px;
    width: 200px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
    grid-column: -3 / -1;
  }
  .b {
    background: #1b998b;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div></div>
</body>
</html>
