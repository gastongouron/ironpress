<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vertical-writing-mode-changes-grid-physical-axes</title>
<style>
  @page { size: 220px 170px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    writing-mode: vertical-rl;
    grid-template-columns: 50px 50px;
    grid-template-rows: 70px 70px;
    width: 140px;
    height: 100px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
  }
  .b {
    background: #1b998b;
  }
  .c {
    background: #f4d35e;
  }
  .d {
    background: #5a3fff;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div></div>
</body>
</html>
