<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid template areas spanning rows</title>
<style>
  @page { size: 278px 141px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: 80px 80px;
    grid-template-rows: 50px 50px;
    grid-template-areas:
      "nav main"
      "nav foot";
    width: 160px;
    height: 100px;
    margin: 20px;
  }
  .nav  { background: #ff5a5f; grid-area: nav; }
  .main { background: #2ec4b6; grid-area: main; }
  .foot { background: #ffbf00; grid-area: foot; }
</style>
</head>
<body>
  <div class="grid">
    <div class="nav"></div>
    <div class="main"></div>
    <div class="foot"></div>
  </div>
</body>
</html>
