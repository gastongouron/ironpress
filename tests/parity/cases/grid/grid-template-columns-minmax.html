<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid template-columns minmax</title>
<style>
  @page { size: 457px 142px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: minmax(80px, 1fr) minmax(120px, 1fr);
    grid-template-rows: 100px;
    width: 340px;
    height: 100px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .cell { border: 2px solid #003a8c; }
  .a { background: #ff5a5f; }
  .b { background: #2ec4b6; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell a"></div>
    <div class="cell b"></div>
  </div>
</body>
</html>
