<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>absolute-grid-child-does-not-consume-an-auto-placement-cell</title>
<style>
  @page { size: 230px 130px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    position: relative;
    grid-template-columns: 70px 70px;
    grid-template-rows: 60px;
    width: 140px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .abs {
    position: absolute;
    left: 15px;
    top: 15px;
    width: 40px;
    height: 30px;
    background: #f4d35e;
  }
  .a {
    background: #d7263d;
  }
  .b {
    background: #1b998b;
  }
</style>
</head>
<body>
<div class="grid"><div class="abs"></div><div class="a"></div><div class="b"></div></div>
</body>
</html>
