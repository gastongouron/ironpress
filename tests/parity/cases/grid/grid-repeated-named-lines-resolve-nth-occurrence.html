<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>repeated-named-lines-resolve-nth-occurrence</title>
<style>
  @page { size: 260px 130px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3,[col] 60px);
    grid-template-rows: 60px;
    width: 180px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
    grid-column: 2 col / 3 col;
  }
  .b {
    background: #1b998b;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div></div>
</body>
</html>
