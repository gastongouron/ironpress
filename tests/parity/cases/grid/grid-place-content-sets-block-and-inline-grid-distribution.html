<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>place-content-sets-block-and-inline-grid-distribution</title>
<style>
  @page { size: 320px 210px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: 60px 60px;
    grid-template-rows: 40px;
    width: 240px;
    height: 140px;
    place-content: end center;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
  }
  .b {
    background: #1b998b;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div></div>
</body>
</html>
