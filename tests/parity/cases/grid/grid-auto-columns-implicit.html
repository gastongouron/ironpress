<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid-auto-columns-implicit</title>
<style>
  @page { size: 380px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: 80px;
    grid-template-rows: 70px;
    grid-auto-columns: 60px 120px;
    width: 300px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a { background: #d7263d; }
  .b { background: #1b998b; grid-column: 3 / 4; }
</style>
</head>
<body>
  <div class="grid">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
