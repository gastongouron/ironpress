<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>span-integer-named-line-syntax-is-honored</title>
<style>
  @page { size: 230px 130px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: [target] 50px [target] 50px [target] 50px [target];
    grid-template-rows: 60px;
    width: 150px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
    grid-column: span 2 target / target 3;
  }
  .b {
    background: #1b998b;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div></div>
</body>
</html>
