<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid-shorthand-resets-omitted-implicit-grid-properties</title>
<style>
  @page { size: 230px 190px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: 60px 60px;
    grid: 60px 60px / 70px 70px;
    width: 140px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
  }
  .b {
    background: #1b998b;
  }
  .c {
    background: #f4d35e;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div><div class="c"></div></div>
</body>
</html>
