<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>subgrid-inherits-parent-gutters-on-subgridded-axis</title>
<style>
  @page { size: 260px 130px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .outer {
    display: grid;
    grid-template-columns: 70px 70px;
    column-gap: 30px;
    grid-template-rows: 70px;
    width: 170px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .sub {
    display: grid;
    grid-column: 1 / 3;
    grid-template-columns: subgrid;
  }
  .a {
    background: #d7263d;
  }
  .b {
    background: #1b998b;
  }
</style>
</head>
<body>
<div class="outer"><div class="sub"><div class="a"></div><div class="b"></div></div></div>
</body>
</html>
