<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid place-items center</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: 120px 120px;
    grid-template-rows: 120px;
    place-items: center;
    width: 240px;
    height: 120px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .cell {
    width: 50px;
    height: 50px;
    border: 2px solid #003a8c;
  }
  .a { background: #ff5a5f; }
  .b { background: #2ec4b6; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell a"></div>
    <div class="cell b"></div>
  </div>
</body>
</html>
