<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid template-columns fr mix</title>
<style>
  @page { size: 477px 162px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    grid-template-rows: 120px;
    width: 360px;
    height: 120px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .cell { border: 2px solid #003a8c; }
  .a { background: #ff5a5f; }
  .b { background: #2ec4b6; }
  .c { background: #ffbf00; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell a"></div>
    <div class="cell b"></div>
    <div class="cell c"></div>
  </div>
</body>
</html>
