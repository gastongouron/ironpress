<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>inline-child-grid-item-is-blockified</title>
<style>
  @page { size: 200px 130px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: 120px;
    grid-template-rows: 70px;
    margin: 20px;
    width: 120px;
    border: 2px solid #000000;
    justify-items: start;
    align-items: start;
  }
  .item {
    display: inline;
    width: 90px;
    height: 50px;
    background: #d7263d;
    color: #fff;
  }
</style>
</head>
<body>
<div class="grid"><span class="item">X</span></div>
</body>
</html>
