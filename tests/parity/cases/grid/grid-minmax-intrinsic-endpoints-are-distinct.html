<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>minmax-intrinsic-endpoints-are-distinct</title>
<style>
  @page { size: 440px 140px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: minmax(min-content,max-content) 1fr;
    width: 360px;
    grid-template-rows: 80px;
    margin: 20px;
    border: 2px solid #000000;
    font-size: 18px;
  }
  .a {
    background: #d7263d;
    color: #fff;
  }
  .b {
    background: #1b998b;
  }
</style>
</head>
<body>
<div class="grid"><div class="a">aa bb cc dd ee</div><div class="b"></div></div>
</body>
</html>
