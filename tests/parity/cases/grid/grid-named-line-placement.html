<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid named line placement</title>
<style>
  @page { size: 297px 121px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: [c1] 60px [c2] 60px [c3] 60px [c4];
    grid-template-rows: 80px;
    width: 180px;
    height: 80px;
    margin: 20px;
  }
  .a { background: #ff5a5f; grid-column: c1 / c3; }
  .b { background: #2ec4b6; grid-column: c3 / c4; }
</style>
</head>
<body>
  <div class="grid">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
