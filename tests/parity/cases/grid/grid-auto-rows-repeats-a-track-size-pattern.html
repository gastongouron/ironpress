<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid-auto-rows-repeats-a-track-size-pattern</title>
<style>
  @page { size: 170px 190px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: 80px;
    grid-auto-rows: 30px 70px;
    width: 80px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
  }
  .b {
    background: #1b998b;
  }
  .c {
    background: #f4d35e;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div><div class="c"></div></div>
</body>
</html>
