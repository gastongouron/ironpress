<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>area-names-generate-start-and-end-lines</title>
<style>
  @page { size: 300px 170px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: 70px 70px 70px;
    grid-template-rows: 50px 50px;
    grid-template-areas: "hero hero side" "hero hero side";
    width: 210px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .a {
    background: #d7263d;
    grid-column: hero-start / hero-end;
    grid-row: hero-start / hero-end;
  }
  .b {
    background: #1b998b;
    grid-area: side;
  }
</style>
</head>
<body>
<div class="grid"><div class="a"></div><div class="b"></div></div>
</body>
</html>
