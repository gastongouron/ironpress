<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid-item-margins-inset-the-item-box</title>
<style>
  @page { size: 220px 150px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: 140px;
    grid-template-rows: 90px;
    width: 140px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .item {
    background: #d7263d;
    margin: 15px 25px 10px 20px;
  }
</style>
</head>
<body>
<div class="grid"><div class="item"></div></div>
</body>
</html>
