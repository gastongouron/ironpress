<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>place-self-overrides-both-item-alignment-axes</title>
<style>
  @page { size: 220px 160px; margin: 0; }
  html {
    font-family: ParitySans;
    line-height: 1.5;
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  html, body {
    background: #ffffff;
  }
  .grid {
    display: grid;
    grid-template-columns: 140px;
    grid-template-rows: 100px;
    width: 140px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .item {
    width: 60px;
    height: 40px;
    background: #d7263d;
    place-self: end center;
  }
</style>
</head>
<body>
<div class="grid"><div class="item"></div></div>
</body>
</html>
