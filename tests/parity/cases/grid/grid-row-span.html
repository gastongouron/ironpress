<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>grid row span</title>
<style>
  @page { size: 279px 202px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .grid {
    display: grid;
    grid-template-columns: 80px 80px;
    grid-template-rows: 80px 80px;
    width: 160px;
    height: 160px;
    margin: 20px;
    border: 2px solid #000000;
  }
  .cell { border: 2px solid #003a8c; }
  .a { background: #ff5a5f; grid-row: span 2; }
  .b { background: #2ec4b6; }
  .c { background: #ffbf00; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell a"></div>
    <div class="cell b"></div>
    <div class="cell c"></div>
  </div>
</body>
</html>
