<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>no-open-quote no-close-quote</title>
<style>
  @page { size: 485px 109px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 360px;
    margin: 24px;
    padding: 10px;
    border: 2px solid #003049;
    background: #fdf0d5;
    font-family: ParitySerif;
    font-size: 28px;
    line-height: 1.3;
    color: #003049;
  }
  .q { quotes: '<' '>'; }
  .q::before { content: no-open-quote; color: #c1121f; }
  .q::after  { content: close-quote; color: #c1121f; }
</style>
</head>
<body>
  <div class="box"><span class="q">quoted</span></div>
</body>
</html>
