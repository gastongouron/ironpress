<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 320px 170px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 12px; }
  p {
    width: 240px;
    border: 2px solid #333333;
    background: #eef2ff;
    font-family: ParitySans;
    font-size: 18px;
    line-height: 26px;
    color: #111111;
  }
  p::first-line {
    font-size: 34px;
    line-height: 42px;
    background: #ffeb3b;
    color: #111111;
  }
</style>
</head>
<body>
  <p>Large first line wraps differently from the following ordinary text.</p>
</body>
</html>
