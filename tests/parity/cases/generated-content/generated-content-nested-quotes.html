<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nested quotes two levels</title>
<style>
  @page { size: 505px 106px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 380px;
    margin: 24px;
    padding: 10px;
    border: 2px solid #003049;
    background: #fdf0d5;
    font-family: ParitySerif;
    font-size: 26px;
    line-height: 1.3;
    color: #003049;
  }
  .q {
    quotes: '<' '>' '[' ']';
  }
  .q::before {
    content: open-quote "outer " open-quote "inner" close-quote close-quote;
    color: #c1121f;
  }
</style>
</head>
<body>
  <div class="box"><span class="q"></span></div>
</body>
</html>
