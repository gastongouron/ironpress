<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>first-letter drop cap</title>
<style>
  @page { size: 425px 208px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 300px;
    margin: 24px;
    padding: 10px;
    border: 2px solid #283618;
    background: #fefae0;
    font-family: ParitySerif;
    font-size: 20px;
    line-height: 1.35;
    color: #283618;
  }
  .para::first-letter {
    float: left;
    font-size: 56px;
    line-height: 1;
    padding-right: 6px;
    color: #bc6c25;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="box"><p class="para">Drop cap leads this short paragraph while the remaining text wraps beside the enlarged initial letter.</p></div>
</body>
</html>
