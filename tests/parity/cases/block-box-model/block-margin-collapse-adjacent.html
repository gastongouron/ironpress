<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 317px 160px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  /* No top/bottom padding or border on the container so adjacent vertical
     margins between the two children collapse to the larger (40px), not 60px. */
  .container {
    width: 240px;
    background: #cfd8e3;
    border-left: 2px solid #11305f;
    border-right: 2px solid #11305f;
  }
  .a {
    height: 60px;
    margin-bottom: 40px;
    background: #2d6cdf;
  }
  .b {
    height: 60px;
    margin-top: 24px;
    background: #d94f4f;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
