<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 277px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background: #f0e44a;
    border-style: solid;
    border-color: #11305f;
    /* asymmetric border widths to test each edge independently */
    border-top-width: 6px;
    border-right-width: 14px;
    border-bottom-width: 22px;
    border-left-width: 30px;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
