<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 317px 191px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  /* CSS 2.1 § 8.3.1: the bottom margin of a box collapses with the bottom margin
     of its last in-flow child when the parent has auto height and no bottom
     padding/border. Here the child's margin-bottom:60px collapses through the
     auto-height parent; the following sibling sits 60px below the child (not
     90px = 60+30). The parent's own box ends at the child's bottom edge. */
  html, body { margin: 0; background: #ffffff; }
  .parent {
    width: 240px;
    background: #cfd8e3;
  }
  .child {
    height: 80px;
    margin-bottom: 60px;
    background: #2d6cdf;
  }
  .after {
    width: 240px;
    height: 50px;
    margin-top: 30px;
    background: #d94f4f;
  }
</style>
</head>
<body>
  <div class="parent">
    <div class="child"></div>
  </div>
  <div class="after"></div>
</body>
</html>
