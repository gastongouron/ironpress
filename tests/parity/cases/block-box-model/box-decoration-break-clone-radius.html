<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* box-decoration-break:clone WITH border-radius across a page break. Under
     clone each fragment is independently wrapped with the FULL border, padding
     and background, so BOTH fragments are fully closed boxes with all FOUR
     rounded corners (page 1 rounded top+bottom, page 2 rounded top+bottom). This
     contrasts with the slice-radius case where each fragment keeps only its real
     corners. The multi-page harness asserts the page COUNT (2) and diffs both
     pages. */
  @page { size: 340px 240px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-family: ParitySans; line-height: 1.5; background: #ffffff; }
  .box {
    width: 260px;
    background: #d9ead9;
    border: 10px solid #14401b;
    border-radius: 28px;
    padding: 14px;
    box-decoration-break: clone;
  }
  .row { height: 64px; break-inside: avoid; }
  .a { background: #2e9e5b; }
  .b { background: #2d6cdf; }
  .c { background: #b048c4; }
  .d { background: #e08a1e; }
</style>
</head>
<body>
  <div class="box">
    <div class="row a"></div>
    <div class="row b"></div>
    <div class="row c"></div>
    <div class="row d"></div>
  </div>
</body>
</html>
