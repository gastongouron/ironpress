<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  /* content-box (default): rendered width = 200 + 2*24 padding + 2*8 border = 264px. */
  .box {
    box-sizing: content-box;
    width: 200px;
    height: 200px;
    padding: 24px;
    border: 8px solid #11305f;
    background: #2d6cdf;
  }
  .fill {
    width: 100%;
    height: 100%;
    background: #f0e44a;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="fill"></div>
  </div>
</body>
</html>
