<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 317px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  /* CSS 2.1 § 10.5: percentage height resolves against the parent's definite
     content height. .parent has height:200px (content-box), so the child's
     height:50% = 100px. The blue box fills the top half of the parent. */
  html, body { margin: 0; background: #ffffff; }
  .parent {
    box-sizing: content-box;
    width: 240px;
    height: 200px;
    background: #cfd8e3;
  }
  .child {
    width: 240px;
    height: 50%;
    background: #2d6cdf;
  }
</style>
</head>
<body>
  <div class="parent">
    <div class="child"></div>
  </div>
</body>
</html>
