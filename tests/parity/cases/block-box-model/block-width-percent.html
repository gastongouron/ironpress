<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 477px 141px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .parent {
    width: 400px;
    height: 140px;
    background: #cfd8e3;
    border: 2px solid #11305f;
  }
  /* 50% of the 400px parent content box = 200px */
  .half {
    width: 50%;
    height: 100%;
    background: #2d6cdf;
    border-right: 4px solid #11305f;
  }
</style>
</head>
<body>
  <div class="parent">
    <div class="half"></div>
  </div>
</body>
</html>
