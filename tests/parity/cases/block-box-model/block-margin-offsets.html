<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .track {
    width: 360px;
    height: 200px;
    background: #cfd8e3;
    border: 2px solid #11305f;
  }
  /* asymmetric explicit margins push the box right + down within the track */
  .box {
    width: 120px;
    height: 80px;
    margin-top: 40px;
    margin-left: 90px;
    background: #2d6cdf;
    border: 4px solid #11305f;
  }
</style>
</head>
<body>
  <div class="track">
    <div class="box"></div>
  </div>
</body>
</html>
