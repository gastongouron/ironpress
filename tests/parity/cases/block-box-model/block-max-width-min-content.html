<html lang="en">
<head>

<style>

  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap {
    width: 220px;
    background: #c62828;
  }
  .box {
    width: 200px;
    max-width: min-content;
    font-size: 16px;
    line-height: 24px;
    color: #0a7f2e;
    background: #0a7f2e;
  }
</style>
</head>
<body>
  <div class="wrap"><div class="box">alpha betabetabeta gamma</div></div>
</body>
</html>
