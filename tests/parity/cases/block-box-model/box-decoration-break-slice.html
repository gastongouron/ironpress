<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Explicit `box-decoration-break: slice` (the default) on a tall bordered box
     that spans a page break. Page 1 carries the TOP border and is OPEN at the
     page bottom; page 2 carries the BOTTOM border and is OPEN at the top. Pins
     the slice behaviour against the default-driven `container-splits` case. */
  @page { size: 340px 240px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-family: ParitySans; line-height: 1.5; background: #ffffff; }
  .box {
    width: 260px;
    background: #ffd9d9;
    border: 10px solid #6b1414;
    padding: 14px;
    box-decoration-break: slice;
  }
  /* Atomic children so both engines break BETWEEN children, not inside one. */
  .row { height: 64px; break-inside: avoid; }
  .a { background: #d94f4f; }
  .b { background: #2d6cdf; }
  .c { background: #2e9e5b; }
  .d { background: #e08a1e; }
</style>
</head>
<body>
  <div class="box">
    <div class="row a"></div>
    <div class="row b"></div>
    <div class="row c"></div>
    <div class="row d"></div>
  </div>
</body>
</html>
