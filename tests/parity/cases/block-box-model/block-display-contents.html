<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 180px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 20px; }
  .wrapper {
    display: contents;
    background: #c62828;
    padding: 20px;
  }
  .child {
    width: 70px;
    height: 28px;
    background: #0a7f2e;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
  <div class="wrapper">
    <div class="child"></div>
    <div class="child"></div>
  </div>
</body>
</html>
