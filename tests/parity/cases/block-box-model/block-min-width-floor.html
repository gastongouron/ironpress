<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 477px 128px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .track {
    width: 400px;
    border: 2px solid #11305f;
    padding: 12px;
  }
  /* declared width 80px is raised to the 220px min-width floor */
  .floored {
    width: 80px;
    min-width: 220px;
    height: 100px;
    background: #2d6cdf;
    border: 4px solid #11305f;
  }
</style>
</head>
<body>
  <div class="track">
    <div class="floored"></div>
  </div>
</body>
</html>
