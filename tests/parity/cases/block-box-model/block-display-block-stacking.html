<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 377px 154px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap {
    width: 300px;
    border: 2px solid #11305f;
  }
  /* spans forced to display:block must each start on a new line, full width */
  .row {
    display: block;
    height: 50px;
    border-bottom: 2px solid #11305f;
  }
  .one { background: #2d6cdf; }
  .two { background: #d94f4f; }
  .three { background: #4caf50; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="row one"></span>
    <span class="row two"></span>
    <span class="row three"></span>
  </div>
</body>
</html>
