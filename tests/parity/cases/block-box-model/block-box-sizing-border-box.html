<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 277px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  html, body { margin: 0; background: #ffffff; }
  /* border-box: total rendered width stays 200px despite padding + border. */
  .box {
    box-sizing: border-box;
    width: 200px;
    height: 200px;
    padding: 24px;
    border: 8px solid #11305f;
    background: #2d6cdf;
  }
  .fill {
    width: 100%;
    height: 100%;
    background: #f0e44a;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="fill"></div>
  </div>
</body>
</html>
