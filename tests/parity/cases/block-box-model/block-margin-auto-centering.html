<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 477px 117px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .track {
    width: 400px;
    background: #cfd8e3;
    border: 2px solid #11305f;
    padding: 16px 0;
  }
  .centered {
    width: 160px;
    height: 80px;
    margin-left: auto;
    margin-right: auto;
    background: #2d6cdf;
    border: 4px solid #11305f;
  }
</style>
</head>
<body>
  <div class="track">
    <div class="centered"></div>
  </div>
</body>
</html>
