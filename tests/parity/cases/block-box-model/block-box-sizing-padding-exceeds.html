<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 237px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  /* css-sizing-3 § 5.1: under box-sizing:border-box, the content width is the
     declared width minus padding+border, floored at zero. Here width:100px with
     padding-left:80px + padding-right:80px (=160px > 100px): the content box
     floors to 0, and the rendered BORDER box grows to the padding sum = 160px
     (the box cannot be narrower than its own padding). The blue background fills
     the full 160px border box; there is no content area. */
  html, body { margin: 0; background: #ffffff; }
  .box {
    box-sizing: border-box;
    width: 100px;
    height: 120px;
    padding-left: 80px;
    padding-right: 80px;
    background: #2d6cdf;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
