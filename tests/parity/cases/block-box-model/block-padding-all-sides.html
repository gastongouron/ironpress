<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 421px 154px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .outer {
    width: 280px;
    background: #d94f4f;
    border: 2px solid #5a1414;
    /* content-box so padding expands the visible red frame around the inner box */
    box-sizing: content-box;
    padding: 30px;
  }
  .inner {
    width: 100%;
    height: 90px;
    background: #2d6cdf;
  }
</style>
</head>
<body>
  <div class="outer">
    <div class="inner"></div>
  </div>
</body>
</html>
