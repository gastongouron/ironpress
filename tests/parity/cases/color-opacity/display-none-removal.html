<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>display none removes box from flow</title>
<style>
  @page { size: 277px 80px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .a {
    width: 200px;
    height: 80px;
    background-color: #c62828;
    display: none;
  }
  .b {
    width: 200px;
    height: 80px;
    background-color: #2e7d32;
  }
</style>
</head>
<body>
  <div class="a"></div>
  <div class="b"></div>
</body>
</html>
