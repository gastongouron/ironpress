<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>color hwb() function</title>
<style>
  @page { size: 277px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 120px;
    /* css-color-4 §8: hwb(194 0% 0%) is fully saturated == hsl(194 100% 50%) */
    background-color: hwb(194 0% 0%);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
