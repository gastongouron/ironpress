<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>color rgb() modern slash-alpha over solid</title>
<style>
  @page { size: 277px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .under {
    width: 200px;
    height: 120px;
    background-color: #1565c0;
    position: relative;
  }
  .over {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 120px;
    height: 80px;
    /* css-color-4 §11: modern space syntax rgb(r g b / a) with decimal alpha */
    background-color: rgb(255 87 34 / 0.5);
  }
</style>
</head>
<body>
  <div class="under"><div class="over"></div></div>
</body>
</html>
