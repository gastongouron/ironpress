<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>opacity text glyph group</title>
<style>
  @page { size: 220px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #000000; }
  .stage {
    width: 220px;
    height: 150px;
    overflow: hidden;
    background: #000000;
  }
  .glyphs {
    width: 220px;
    height: 150px;
    padding-left: 20px;
    color: #ffffff;
    opacity: 0.5;
    font-size: 108px;
    font-weight: 700;
    line-height: 150px;
    letter-spacing: -44px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="stage"><div class="glyphs">OO</div></div>
</body>
</html>
