<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>opacity percentage</title>
<style>
  @page { size: 180px 100px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage {
    width: 180px;
    height: 100px;
    background: #1565c0;
  }
  .box {
    width: 120px;
    height: 70px;
    background: #e53935;
    opacity: 50%;
  }
</style>
</head>
<body>
  <div class="stage"><div class="box"></div></div>
</body>
</html>
