<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 200px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  p {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    width: 135px;
    font-size: 14px;
    line-height: 20px;
    color: #ffffff;
    background: #0a7f2e;
  }
  .under {
    width: 135px;
    height: 45px;
    background: #c62828;
  }
</style>
</head>
<body>
  <p>alpha beta gamma delta epsilon zeta eta theta iota kappa lambda</p>
  <div class="under"></div>
</body>
</html>
