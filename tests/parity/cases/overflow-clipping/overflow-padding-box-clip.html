<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>overflow clip at padding box</title>
<style>
  @page { size: 317px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 30px; }
  /* A padded clipper with an oversized child. The clip edge must be the
     PADDING box: the child fills the whole padding box (under the padding,
     out to the inner border edge) and is cut there, so the border stays fully
     visible on all four sides. This isolates the padding-box-vs-border-box and
     padding-box-vs-content-box clip behaviour. */
  .clip {
    overflow: hidden;
    width: 180px;
    height: 140px;
    padding: 24px;
    background: #eaeded;
    border: 4px solid #283747;
  }
  .child {
    width: 300px;
    height: 240px;
    background: #5499c7;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="clip">
      <div class="child"></div>
    </div>
  </div>
</body>
</html>
