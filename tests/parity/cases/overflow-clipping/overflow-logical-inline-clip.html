<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 220px 160px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 90px;
    height: 70px;
    overflow-inline: clip;
    overflow-block: visible;
    background: #c62828;
  }
  .child {
    width: 150px;
    height: 120px;
    background: #0a7f2e;
  }
</style>
</head>
<body>
  <div class="box"><div class="child"></div></div>
</body>
</html>
