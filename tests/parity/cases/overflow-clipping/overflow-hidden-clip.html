<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>overflow hidden clip</title>
<style>
  @page { size: 297px 181px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 30px; }
  /* overflow:hidden clips an oversized in-flow child to the clip box.
     The child extends 90px past the right edge and 80px past the bottom. */
  .clip {
    overflow: hidden;
    width: 160px;
    height: 120px;
    background: #eaf2f8;
    border: 3px solid #1f3a5f;
  }
  .child {
    width: 250px;
    height: 200px;
    background: #2e86c1;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="clip">
      <div class="child"></div>
    </div>
  </div>
</body>
</html>
