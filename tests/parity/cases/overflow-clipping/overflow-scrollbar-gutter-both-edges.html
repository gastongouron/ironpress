<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 220px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 160px;
    height: 80px;
    overflow: auto;
    scrollbar-gutter: stable both-edges;
    background: #c62828;
  }
  .child {
    width: 100%;
    height: 80px;
    background: #0a7f2e;
  }
</style>
</head>
<body>
  <div class="box"><div class="child"></div></div>
</body>
</html>
