<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 180px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 30px; }
  .box {
    width: 80px;
    height: 80px;
    overflow-x: visible;
    overflow-y: hidden;
    background: #d9d9d9;
  }
  .child {
    width: 130px;
    height: 130px;
    background: #0a7f2e;
  }
</style>
</head>
<body>
  <div class="box"><div class="child"></div></div>
</body>
</html>
