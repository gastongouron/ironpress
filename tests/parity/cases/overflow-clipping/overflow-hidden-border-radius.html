<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>overflow hidden with border-radius</title>
<style>
  @page { size: 307px 191px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 30px; }
  /* overflow:hidden combined with border-radius clips the overflowing
     child to the rounded corners of the clip box. */
  .clip {
    overflow: hidden;
    border-radius: 28px;
    width: 170px;
    height: 130px;
    background: #fdedec;
    border: 3px solid #7b241c;
  }
  .child {
    width: 260px;
    height: 210px;
    background: #c0392b;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="clip">
      <div class="child"></div>
    </div>
  </div>
</body>
</html>
