<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linear gradient calc stops</title>
<style>
  @page { size: 220px 100px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 180px;
    height: 60px;
    margin: 20px;
    background-image: linear-gradient(90deg, #e53935 0 calc(50% - 10px), #1e88e5 calc(50% + 10px) 100%);
    border: 4px solid #111111;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
