<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>conic-gradient at position</title>
<style>
  @page { size: 278px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background-image: conic-gradient(from 0deg at 30% 30%, #e53935 0deg 90deg, #43a047 90deg 180deg, #1e88e5 180deg 270deg, #fdd835 270deg 360deg);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
