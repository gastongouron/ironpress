<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>radial-gradient circle farthest-side</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 260px;
    height: 160px;
    background-color: #004d40;
    background-image: radial-gradient(circle farthest-side at center, #b2ff59, #004d40);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
