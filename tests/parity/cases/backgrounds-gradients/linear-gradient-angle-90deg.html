<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linear-gradient 90deg angle</title>
<style>
  @page { size: 337px 141px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 260px;
    height: 140px;
    background-image: linear-gradient(90deg, #c2185b, #00838f);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
