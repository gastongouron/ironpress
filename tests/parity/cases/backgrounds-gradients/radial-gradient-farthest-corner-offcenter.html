<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>radial gradient farthest corner offcenter</title>
<style>
  @page { size: 180px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 140px;
    height: 100px;
    margin: 20px;
    background-image: radial-gradient(circle farthest-corner at 35px 30px, #e53935 0%, #e53935 45%, #1e88e5 46%, #1e88e5 100%);
    border: 4px solid #111111;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
