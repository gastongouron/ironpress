<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>radial-gradient explicit pixel size</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 220px;
    height: 220px;
    background-color: #1a237e;
    background-image: radial-gradient(circle 60px at center, #ffd600, #1a237e);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
