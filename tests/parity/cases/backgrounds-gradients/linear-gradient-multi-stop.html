<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linear-gradient three color stops with positions</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 300px;
    height: 120px;
    background-image: linear-gradient(to right, #d32f2f 0%, #fbc02d 50%, #2e7d32 100%);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
