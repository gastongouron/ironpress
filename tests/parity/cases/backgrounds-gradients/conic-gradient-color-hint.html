<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>conic gradient color hint</title>
<style>
  @page { size: 160px 160px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 120px;
    height: 120px;
    margin: 20px;
    background-image: conic-gradient(#e53935 0deg, 75%, #1e88e5 360deg);
    border: 4px solid #111111;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
