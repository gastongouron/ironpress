<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>background-size cover</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 240px;
    height: 160px;
    background-color: #eceff1;
    background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAIAAAAmkwkpAAAAIElEQVR42mO4rK8PRJJll4CIAYWjV2sERF/rxYEIhQMABxYT6ZMR6l4AAAAASUVORK5CYII=");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
