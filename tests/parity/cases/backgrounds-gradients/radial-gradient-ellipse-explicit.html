<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>radial-gradient ellipse explicit radii</title>
<style>
  @page { size: 337px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 260px;
    height: 200px;
    background-color: #263238;
    background-image: radial-gradient(ellipse 120px 60px at center, #ffab40, #263238);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
