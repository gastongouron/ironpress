<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>radial-gradient ellipse positioned at top left</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 280px;
    height: 160px;
    background-image: radial-gradient(ellipse at top left, #00897b, #b71c1c);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
