<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linear gradient oklab interpolation</title>
<style>
  @page { size: 180px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 140px;
    height: 80px;
    margin: 20px;
    background-image: linear-gradient(90deg in oklab, #1e88e5, #e53935);
    border: 4px solid #111111;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
