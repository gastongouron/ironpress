<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linear-gradient color hint</title>
<style>
  @page { size: 240px 80px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .bar {
    width: 240px;
    height: 80px;
    background-color: #777777;
    background-image: linear-gradient(to right, #d50000, 20%, #2962ff);
  }
</style>
</head>
<body>
  <div class="bar"></div>
</body>
</html>
