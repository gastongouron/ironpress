<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>radial-gradient circle at center</title>
<style>
  @page { size: 278px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background-image: radial-gradient(circle at center, #f9a825, #4a148c);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
