<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>repeating radial gradient px ranges</title>
<style>
  @page { size: 180px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 140px;
    height: 100px;
    margin: 20px;
    background-image: repeating-radial-gradient(circle at 50px 50px, #e53935 0 10px, #1e88e5 10px 20px);
    border: 4px solid #111111;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
