<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>repeating-linear-gradient stripes</title>
<style>
  @page { size: 357px 141px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 280px;
    height: 140px;
    background-image: repeating-linear-gradient(90deg, #c62828 0%, #c62828 10%, #fbc02d 10%, #fbc02d 20%);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
