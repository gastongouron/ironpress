<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linear-gradient to bottom right corner</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background-image: linear-gradient(to bottom right, #1565c0, #ef6c00);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
