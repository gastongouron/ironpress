<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>repeating-conic-gradient wedges</title>
<style>
  @page { size: 278px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background-image: repeating-conic-gradient(#37474f 0deg 30deg, #cfd8dc 30deg 60deg);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
