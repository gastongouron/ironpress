<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>repeating-radial-gradient rings</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 220px;
    height: 220px;
    background-image: repeating-radial-gradient(circle at center, #1565c0 0%, #1565c0 10%, #ef6c00 10%, #ef6c00 20%);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
