<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>conic-gradient hard stops pie</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background-image: conic-gradient(#d32f2f 0deg 120deg, #388e3c 120deg 240deg, #1976d2 240deg 360deg);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
