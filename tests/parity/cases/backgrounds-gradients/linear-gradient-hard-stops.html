<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linear-gradient hard color stops</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 280px;
    height: 140px;
    background-image: linear-gradient(90deg, #d32f2f 0%, #d32f2f 50%, #1565c0 50%, #1565c0 100%);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
