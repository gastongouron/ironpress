<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linear-gradient to bottom side keyword</title>
<style>
  @page { size: 278px 221px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 220px;
    background-image: linear-gradient(to bottom, #00695c, #e0f2f1);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
