<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mix-blend-mode luminosity</title>
<style>
  @page { size: 180px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #0057b8; }
  .source {
    width: 180px;
    height: 120px;
    background: #ffd600;
    mix-blend-mode: luminosity;
  }
</style>
</head>
<body>
  <div class="source"></div>
</body>
</html>
