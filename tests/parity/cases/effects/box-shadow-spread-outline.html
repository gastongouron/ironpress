<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>box-shadow spread outline</title><style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { background: #fff3e0; padding: 48px; }
  /* 0 offset, 0 blur, 12px spread -> a solid even ring of equal size on all sides */
  .box { width: 180px; height: 110px; background-color: #1565c0; box-shadow: 0 0 0 12px #37474f; }
</style></head><body><div class="stage"><div class="box"></div></div></body></html>
