<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>box-shadow negative spread</title>
<style>
  @page { size: 816px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { background: #fff3e0; padding: 40px; }
  /* zero blur + negative spread (-8px=shrink) -> hard-edged shadow smaller than the box */
  .box {
    width: 200px;
    height: 120px;
    background-color: #1565c0;
    box-shadow: 28px 28px 0 -8px #37474f;
  }
</style>
</head>
<body>
  <div class="stage"><div class="box"></div></div>
</body>
</html>
