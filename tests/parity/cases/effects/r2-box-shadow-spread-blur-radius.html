<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 box shadow spread blur radius</title>
<style>
  @page { size: 260px 170px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 260px; height: 170px; padding: 48px; background: #eef7f2; }
  .box { width: 130px; height: 74px; border-radius: 24px; background: #1565c0; box-shadow: 0 0 18px 16px #00695c; }
</style>
</head>
<body>
  <div class="stage"><div class="box"></div></div>
</body>
</html>
