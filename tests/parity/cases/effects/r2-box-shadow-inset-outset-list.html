<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 box shadow inset outset list</title>
<style>
  @page { size: 240px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 240px; height: 130px; padding: 30px; background: #ffffff; }
  .box { width: 100px; height: 70px; background: #ffe082; box-shadow: 86px 0 0 0 #1565c0, inset 0 0 0 16px #d32f2f; }
</style>
</head>
<body>
  <div class="stage"><div class="box"></div></div>
</body>
</html>
