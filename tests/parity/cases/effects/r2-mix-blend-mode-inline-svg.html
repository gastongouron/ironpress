<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mix blend mode inline svg</title>
<style>
  @page { size: 220px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 220px; height: 140px; padding: 25px; background: #1565c0; }
  svg { width: 120px; height: 90px; mix-blend-mode: screen; }
</style>
</head>
<body>
  <div class="stage"><svg viewBox="0 0 120 90" aria-hidden="true"><circle cx="55" cy="45" r="40" fill="#d32f2f"/></svg></div>
</body>
</html>
