<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 text shadow decoration line</title>
<style>
  @page { size: 280px 110px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .text { width: 280px; height: 110px; padding: 18px; color: #111111; font-size: 46px; font-weight: 700; line-height: 58px; text-decoration: underline; text-decoration-thickness: 7px; text-underline-offset: 8px; text-shadow: 104px 0 0 #d32f2f; }
</style>
</head>
<body>
  <div class="text">UNDER</div>
</body>
</html>
