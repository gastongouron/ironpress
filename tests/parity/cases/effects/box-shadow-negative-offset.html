<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>box-shadow negative offset</title><style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { background: #fff3e0; padding: 56px; }
  /* negative offsets -> shadow to the upper-left */
  .box { width: 180px; height: 110px; background-color: #1565c0; box-shadow: -22px -22px 0 0 #37474f; }
</style></head><body><div class="stage"><div class="box"></div></div></body></html>
