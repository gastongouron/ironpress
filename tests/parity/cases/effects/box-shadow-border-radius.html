<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>box-shadow rounded</title><style>
  @page { size: 816px 191px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { background: #fff3e0; padding: 40px; }
  /* shadow must follow the element's border-radius */
  .box { width: 180px; height: 110px; background-color: #1565c0; border-radius: 24px; box-shadow: 22px 22px 0 0 #37474f; }
</style></head><body><div class="stage"><div class="box"></div></div></body></html>
