<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 opacity isolates descendant blend</title>
<style>
  @page { size: 220px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 220px; height: 130px; padding: 25px; background: #1565c0; }
  .group { width: 150px; height: 80px; opacity: .99; }
  .child { width: 120px; height: 60px; background: #d32f2f; mix-blend-mode: multiply; }
</style>
</head>
<body>
  <div class="stage"><div class="group"><div class="child"></div></div></div>
</body>
</html>
