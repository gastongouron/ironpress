<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mix-blend-mode multiply</title>
<style>
  @page { size: 477px 320px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { position: relative; width: 320px; height: 220px; background: #fff8e1; margin: 40px; }
  .base {
    position: absolute; top: 30px; left: 30px;
    width: 180px; height: 140px;
    background-color: #29b6f6;
  }
  .blend {
    position: absolute; top: 70px; left: 110px;
    width: 180px; height: 140px;
    background-color: #ffca28;
    /* overlap region should darken via multiply */
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
  <div class="stage"><div class="base"></div><div class="blend"></div></div>
</body>
</html>
