<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mix blend mode text difference</title>
<style>
  @page { size: 240px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 240px; height: 120px; padding: 18px; background: #1565c0; }
  .text { color: #ffffff; font-size: 62px; font-weight: 700; line-height: 80px; mix-blend-mode: difference; }
</style>
</head>
<body>
  <div class="stage"><div class="text">TEXT</div></div>
</body>
</html>
