<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>box-shadow currentColor</title><style>
  @page { size: 816px 191px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { background: #fff3e0; padding: 40px; }
  /* color omitted -> shadow uses currentColor (#2e7d32) */
  .box { width: 180px; height: 110px; background-color: #1565c0; color: #2e7d32; box-shadow: 20px 20px 0; }
</style></head><body><div class="stage"><div class="box"></div></div></body></html>
