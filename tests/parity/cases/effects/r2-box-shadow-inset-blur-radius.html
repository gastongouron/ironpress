<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 box shadow inset blur radius</title>
<style>
  @page { size: 220px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .stage { width: 220px; height: 140px; padding: 28px; background: #ffffff; }
  .box { width: 164px; height: 84px; border-radius: 24px; background: #90caf9; box-shadow: inset 0 0 18px 16px rgba(1,87,155,0.85); }
</style>
</head>
<body>
  <div class="stage"><div class="box"></div></div>
</body>
</html>
