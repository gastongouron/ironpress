<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 background blend mode list matching</title>
<style>
  @page { size: 220px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 220px; height: 140px; background-color: #fdd835; background-image: linear-gradient(to right, transparent 0 50%, #d32f2f 50% 100%), linear-gradient(to bottom, #1565c0 0 50%, transparent 50% 100%); background-blend-mode: multiply, screen; }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
