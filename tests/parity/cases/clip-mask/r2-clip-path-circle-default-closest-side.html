<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 clip path circle default closest side</title>
<style>
  @page { size: 200px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 200px; height: 120px; background: #d32f2f; clip-path: circle(); }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
