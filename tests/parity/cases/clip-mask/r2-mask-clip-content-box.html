<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mask clip content box</title>
<style>
  @page { size: 180px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 180px; height: 140px; border: 18px solid #263238; padding: 24px; background: #d32f2f; mask-image: linear-gradient(#000, #000); mask-clip: content-box; -webkit-mask-image: linear-gradient(#000, #000); -webkit-mask-clip: content-box; }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
