<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mask-image url svg</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 200px;
    background-color: #ad1457;
    /* Mask via a data:-URI SVG whose white circle defines the visible disc. */
    -webkit-mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48Y2lyY2xlIGN4PSIxMDAiIGN5PSIxMDAiIHI9IjgwIiBmaWxsPSIjZmZmIi8+PC9zdmc+");
    -webkit-mask-repeat: no-repeat;
    mask-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48Y2lyY2xlIGN4PSIxMDAiIGN5PSIxMDAiIHI9IjgwIiBmaWxsPSIjZmZmIi8+PC9zdmc+");
    mask-repeat: no-repeat;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
