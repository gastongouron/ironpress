<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mask border gradient ring</title>
<style>
  @page { size: 200px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 200px; height: 140px; background: #d32f2f; mask-border-source: linear-gradient(#000, #000); mask-border-slice: 28; mask-border-width: 28px; mask-border-repeat: stretch; }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
