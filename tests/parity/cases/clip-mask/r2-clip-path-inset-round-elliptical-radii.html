<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 clip path inset round elliptical radii</title>
<style>
  @page { size: 230px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 230px; height: 150px; background: #6a1b9a; clip-path: inset(12px 22px 32px 42px round 28px 8px 36px 14px / 10px 30px 16px 26px); }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
