<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mask-image linear-gradient</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 240px;
    height: 160px;
    background-color: #2e7d32;
    /* Mask fades the solid fill out to the right via an alpha gradient. */
    -webkit-mask-image: linear-gradient(to right, #000000 0%, rgba(0,0,0,0) 100%);
    mask-image: linear-gradient(to right, #000000 0%, rgba(0,0,0,0) 100%);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
