<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mask-image repeating-linear-gradient</title>
<style>
  @page { size: 294px 160px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 240px;
    height: 160px;
    background-color: #00695c;
    /* Striped alpha mask: opaque bands alternating with transparent bands
       (css-masking-1 §3.1, repeating CSS gradient image as a mask source). */
    -webkit-mask-image: repeating-linear-gradient(to right, #000 0%, #000 10%, rgba(0,0,0,0) 10%, rgba(0,0,0,0) 20%);
    mask-image: repeating-linear-gradient(to right, #000 0%, #000 10%, rgba(0,0,0,0) 10%, rgba(0,0,0,0) 20%);
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
