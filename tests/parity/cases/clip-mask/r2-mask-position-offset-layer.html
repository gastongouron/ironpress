<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mask position offset layer</title>
<style>
  @page { size: 220px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 220px; height: 140px; background: #1565c0; mask-image: radial-gradient(circle 30px at 40px 40px, #000 0 30px, transparent 31px); mask-size: 80px 80px; mask-repeat: no-repeat; mask-position: 120px 54px; -webkit-mask-image: radial-gradient(circle 30px at 40px 40px, #000 0 30px, transparent 31px); -webkit-mask-size: 80px 80px; -webkit-mask-repeat: no-repeat; -webkit-mask-position: 120px 54px; }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
