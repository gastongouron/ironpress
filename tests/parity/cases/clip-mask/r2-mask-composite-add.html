<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mask composite add</title>
<style>
  @page { size: 200px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 200px; height: 140px; background: #6a1b9a; mask-image: radial-gradient(circle 38px at 55px 70px, #000 0 38px, transparent 39px), radial-gradient(circle 38px at 145px 70px, #000 0 38px, transparent 39px); mask-size: 100% 100%, 100% 100%; mask-repeat: no-repeat, no-repeat; mask-composite: add; -webkit-mask-image: radial-gradient(circle 38px at 145px 70px, #000 0 38px, transparent 39px), radial-gradient(circle 38px at 55px 70px, #000 0 38px, transparent 39px); -webkit-mask-size: 100% 100%, 100% 100%; -webkit-mask-repeat: no-repeat, no-repeat; -webkit-mask-composite: source-over; }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
