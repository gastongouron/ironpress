<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mask shorthand position size repeat alpha</title>
<style>
  @page { size: 220px 130px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 220px; height: 130px; background: #1565c0; mask: linear-gradient(to right, #000 0 50%, transparent 50% 100%) 20px 10px / 80px 80px no-repeat alpha; }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
