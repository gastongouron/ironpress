<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mask-image none</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box {
    width: 200px;
    height: 160px;
    background-color: #c62828;
    /* mask-image: none (css-masking-1 §3.1 initial value): the box paints
       fully opaque, identical to no mask at all. */
    -webkit-mask-image: none;
    mask-image: none;
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
