<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mask image repeating radial rings</title>
<style>
  @page { size: 200px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 200px; height: 200px; background: #1565c0; mask-image: repeating-radial-gradient(circle at 50% 50%, #000 0 12px, transparent 12px 24px); -webkit-mask-image: repeating-radial-gradient(circle at 50% 50%, #000 0 12px, transparent 12px 24px); }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
