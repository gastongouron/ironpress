<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mask image repeating conic spokes</title>
<style>
  @page { size: 200px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 200px; height: 200px; background: #6a1b9a; mask-image: repeating-conic-gradient(#000 0deg 15deg, transparent 15deg 30deg); -webkit-mask-image: repeating-conic-gradient(#000 0deg 15deg, transparent 15deg 30deg); }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
