<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 clip path content box geometry</title>
<style>
  @page { size: 200px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 200px; height: 140px; border: 18px solid #1565c0; padding: 24px; background: #d32f2f; clip-path: content-box; }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
