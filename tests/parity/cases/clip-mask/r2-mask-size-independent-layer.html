<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 mask size independent layer</title>
<style>
  @page { size: 220px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 220px; height: 120px; background: #d32f2f; mask-image: linear-gradient(to right, #000 0 50%, transparent 50% 100%); mask-size: 60px 120px; mask-repeat: no-repeat; -webkit-mask-image: linear-gradient(to right, #000 0 50%, transparent 50% 100%); -webkit-mask-size: 60px 120px; -webkit-mask-repeat: no-repeat; }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
