<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>r2 clip path rect rounded</title>
<style>
  @page { size: 220px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .box { width: 220px; height: 140px; background: #2e7d32; clip-path: rect(22px 180px 110px 35px round 18px); }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
