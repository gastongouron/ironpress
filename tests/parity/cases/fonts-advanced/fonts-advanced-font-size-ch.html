<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font-size ch unit</title>
<style>
  @page { size: 477px 128px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #ffd6a5;
    font-size: 20px;
  }
  .t {
    font-family: ParityMono;
    font-size: 5ch;
    line-height: 1;
    color: #432818;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Ch 5ch</div>
  </div>
</body>
</html>
