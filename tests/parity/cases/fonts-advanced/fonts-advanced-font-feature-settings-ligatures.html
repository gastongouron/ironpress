<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font-feature-settings ligatures</title>
<style>
  @page { size: 477px 94px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #ffc6ff;
  }
  .t {
    font-family: ParitySerif;
    font-size: 30px;
    line-height: 1;
    color: #4a0e4e;
    font-feature-settings: "liga" 0;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">office final</div>
  </div>
</body>
</html>
