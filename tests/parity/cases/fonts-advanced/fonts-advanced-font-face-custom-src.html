<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@font-face custom src</title>
<style>
  @page { size: 477px 94px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  @font-face {
    font-family: ParitySerif;
    src: url('../../fonts/ParitySerif.ttf') format('truetype');
  }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #bdb2ff;
  }
  .t {
    font-family: ParitySerif, ParitySerif;
    font-size: 30px;
    line-height: 1;
    color: #240046;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Custom face</div>
  </div>
</body>
</html>
