<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font-size rem</title>
<style>
  @page { size: 477px 96px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #caf0f8;
    font-size: 10px;
  }
  .t {
    font-family: ParitySans;
    font-size: 2rem;
    line-height: 1;
    color: #03045e;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Rem unit 2rem</div>
  </div>
</body>
</html>
