<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font-variant small-caps</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #caffbf;
  }
  .t {
    font-family: ParitySerif;
    font-size: 30px;
    line-height: 1;
    color: #1b4332;
    font-variant: small-caps;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Small Caps Text</div>
  </div>
</body>
</html>
