<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>text-transform lowercase</title>
<style>
  @page { size: 477px 94px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #ffd6a5;
  }
  .t {
    font-family: ParitySans;
    font-size: 30px;
    line-height: 1;
    color: #3d1518;
    text-transform: lowercase;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">MAKE ME QUIET</div>
  </div>
</body>
</html>
