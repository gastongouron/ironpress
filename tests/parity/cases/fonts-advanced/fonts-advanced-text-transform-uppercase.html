<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>text-transform uppercase</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #cdeac0;
  }
  .t {
    font-family: ParitySans;
    font-size: 30px;
    line-height: 1;
    color: #14213d;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">make me loud</div>
  </div>
</body>
</html>
