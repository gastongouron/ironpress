<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>font-stretch condensed</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .region {
    width: 360px;
    margin: 20px;
    padding: 10px;
    border: 2px solid #000000;
    background: #9bf6ff;
  }
  .t {
    font-family: ParitySans;
    font-size: 30px;
    line-height: 1;
    color: #023047;
    font-stretch: condensed;
  }
</style>
</head>
<body>
  <div class="region">
    <div class="t">Condensed width</div>
  </div>
</body>
</html>
