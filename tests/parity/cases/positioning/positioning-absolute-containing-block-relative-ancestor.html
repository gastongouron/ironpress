<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 377px 261px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* outer is positioned (relative) so it is the containing block;
     the static middle div must NOT capture the absolute child */
  .outer {
    position: relative;
    width: 260px;
    height: 220px;
    background: #e9f0f4;
    border: 2px solid #7fa8c0;
    padding: 20px;
  }
  .middle {
    position: static;
    width: 140px;
    height: 100px;
    background: #cdd9e0;
    border: 2px solid #9bb0bd;
  }
  .box {
    position: absolute;
    top: 0;
    left: 0;
    width: 90px;
    height: 60px;
    background: #16a085;
    border: 2px solid #0a4d40;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="outer">
      <div class="middle">
        <div class="box"></div>
      </div>
    </div>
  </div>
</body>
</html>
