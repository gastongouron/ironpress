<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 287px 226px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #ffffff; }
  .wrap { padding: 20px; position: relative; height: 220px; }
  /* higher z-index paints on top regardless of source order:
     the low box is later in source but has lower z-index */
  .box { position: absolute; width: 120px; height: 120px; border: 2px solid #000000; }
  .high { top: 20px;  left: 20px;  background: #2980b9; z-index: 2; }
  .low  { top: 70px;  left: 70px;  background: #e67e22; z-index: 1; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box high"></div>
    <div class="box low"></div>
  </div>
</body>
</html>
