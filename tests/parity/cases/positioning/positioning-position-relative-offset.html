<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 318px 241px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* relative shifts the box from its in-flow position; flow space is preserved */
  .anchor {
    width: 200px;
    height: 200px;
    background: #e7eef6;
    border: 2px solid #93acc7;
    position: relative;
  }
  .box {
    position: relative;
    top: 30px;
    left: 40px;
    width: 100px;
    height: 70px;
    background: #c0392b;
    border: 2px solid #6e2018;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="anchor">
      <div class="box"></div>
    </div>
  </div>
</body>
</html>
