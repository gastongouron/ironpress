<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 389px 272px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #ffffff; }
  .wrap { padding: 40px; }
  /* overflow:visible (default) does NOT clip; child overflows the parent box */
  .container {
    overflow: visible;
    width: 150px;
    height: 120px;
    background: #e8eef4;
    border: 2px solid #2c3e6e;
  }
  .child {
    width: 230px;
    height: 190px;
    background: #2980b9;
    border: 2px solid #15324f;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <div class="child"></div>
    </div>
  </div>
</body>
</html>
