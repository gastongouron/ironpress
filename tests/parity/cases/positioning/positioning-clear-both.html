<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 417px 195px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* clear:both pushes the cleared block below all preceding floats instead of
     wrapping beside them */
  .container {
    width: 300px;
    background: #f0e8f4;
    border: 2px solid #6e6e6e;
  }
  .float {
    float: left;
    width: 100px;
    height: 90px;
    background: #8e44ad;
    border: 2px solid #4a2259;
  }
  .cleared {
    clear: both;
    height: 60px;
    background: #d6c2e0;
    border: 2px solid #6e6e6e;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <div class="float"></div>
      <div class="cleared"></div>
    </div>
  </div>
</body>
</html>
