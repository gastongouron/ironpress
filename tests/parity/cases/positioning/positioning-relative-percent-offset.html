<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 210px 140px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .cb {
    position: relative;
    width: 160px;
    height: 100px;
    background: #d9d9d9;
  }
  .ref {
    position: absolute;
    left: 40px;
    top: 20px;
    width: 70px;
    height: 40px;
    background: #c62828;
  }
  .target {
    position: relative;
    left: 25%;
    top: 20%;
    width: 70px;
    height: 40px;
    background: #0a7f2e;
  }
</style>
</head>
<body>
  <div class="cb">
    <div class="ref"></div>
    <div class="target"></div>
  </div>
</body>
</html>
