<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 240px 160px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .cb {
    position: relative;
    width: 200px;
    height: 120px;
    background: #c62828;
  }
  .target {
    position: absolute;
    left: 25%;
    right: 25%;
    top: 25%;
    bottom: 25%;
    background: #0a7f2e;
  }
</style>
</head>
<body>
  <div class="cb"><div class="target"></div></div>
</body>
</html>
