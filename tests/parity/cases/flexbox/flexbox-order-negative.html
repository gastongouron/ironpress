<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox order negative value</title>
<style>
  @page { size: 518px 151px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* A negative order value moves the green item before the order:0 items, so
     visual order is green, red, blue even though source order is red, blue,
     green. Equal orders keep source order (red before blue). */
  .flex {
    display: flex;
    width: 400px;
    height: 110px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box { width: 90px; height: 80px; border: 2px solid #102a43; }
  .a { background: #c0392b; order: 0; }
  .b { background: #2980b9; order: 0; }
  .c { background: #27ae60; order: -1; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>
</body>
</html>
