<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox margin-left:auto main-end</title>
<style>
  @page { size: 460px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .flex {
    display: flex;
    width: 420px;
    height: 110px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box {
    width: 80px;
    height: 80px;
    border: 2px solid #102a43;
    background: #c0392b;
    margin-left: auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box"></div>
    </div>
  </div>
</body>
</html>
