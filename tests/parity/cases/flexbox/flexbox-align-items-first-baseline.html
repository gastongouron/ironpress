<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; align-items: first baseline; width: 230px; height: 110px; border: 2px solid #222222; background: #eeeeee; }
    .item { padding: 0 8px; color: #ffffff; }
    .big { font-size: 40px; background: #c0392b; }
    .small { font-size: 16px; background: #2980b9; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item big">A</div>
    <div class="item small">B</div>
  </div>
</body>
</html>
