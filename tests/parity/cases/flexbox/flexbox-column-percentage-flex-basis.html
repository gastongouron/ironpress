<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 280px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; flex-direction: column; width: 160px; height: 200px; border: 2px solid #222222; }
    .a { flex: 0 0 50%; background: #c0392b; }
    .b { flex: 0 0 25%; background: #2980b9; }
    .c { flex: 0 0 25%; background: #27ae60; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="a"></div>
    <div class="b"></div>
    <div class="c"></div>
  </div>
</body>
</html>
