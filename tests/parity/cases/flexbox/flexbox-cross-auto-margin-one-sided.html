<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; align-items: flex-start; width: 240px; height: 120px; background: #eeeeee; border: 2px solid #222222; }
    .item { width: 70px; height: 40px; background: #c0392b; border: 2px solid #102a43; }
    .push { margin-top: auto; background: #2980b9; margin-left: 12px; }
  </style>
</head>
<body><div class="flex"><div class="item"></div><div class="item push"></div></div></body>
</html>
