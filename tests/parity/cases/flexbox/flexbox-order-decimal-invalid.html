<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; gap: 10px; width: 230px; border: 2px solid #222222; }
    .item { width: 55px; height: 45px; }
    .a { order: 1.5; background: #c0392b; }
    .b { order: 0; background: #2980b9; }
    .c { order: 1; background: #27ae60; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item a"></div>
    <div class="item b"></div>
    <div class="item c"></div>
  </div>
</body>
</html>
