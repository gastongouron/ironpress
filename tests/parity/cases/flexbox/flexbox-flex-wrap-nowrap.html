<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox flex-wrap:nowrap</title>
<style>
  @page { size: 417px 141px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* nowrap keeps a single line; shrinkable items compress to fit. */
  .flex {
    display: flex;
    flex-wrap: nowrap;
    width: 300px;
    height: 100px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box {
    flex: 1 1 150px;
    height: 80px;
    border: 2px solid #102a43;
  }
  .a { background: #c0392b; }
  .b { background: #2980b9; }
  .c { background: #27ae60; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>
</body>
</html>
