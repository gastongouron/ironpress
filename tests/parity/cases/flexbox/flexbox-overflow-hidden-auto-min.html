<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; width: 180px; height: 64px; border: 2px solid #222222; background: #eeeeee; }
    .a { flex: 1 1 0; overflow: hidden; white-space: nowrap; height: 60px; background: #c0392b; color: #ffffff; font-size: 18px; }
    .b { flex: 0 0 70px; height: 60px; background: #2980b9; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="a">LONGWORDLONGWORDLONGWORD</div>
    <div class="b"></div>
  </div>
</body>
</html>
