<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; width: min-content; gap: 10px; border: 4px solid #222222; background: #eeeeee; }
    .item { height: 45px; }
    .a { width: 80px; background: #c0392b; }
    .b { width: 50px; background: #2980b9; }
    .c { width: 40px; background: #27ae60; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item a"></div>
    <div class="item b"></div>
    <div class="item c"></div>
  </div>
</body>
</html>
