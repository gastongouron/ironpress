<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox flex-basis:percentage</title>
<style>
  @page { size: 518px 151px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* flex-basis percentages resolve against the container's inner main size
     (400px): 25% / 50% / 25% => 100 / 200 / 100. */
  .flex {
    display: flex;
    width: 400px;
    height: 110px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box { height: 80px; border: 2px solid #102a43; flex-grow: 0; flex-shrink: 0; }
  .a { background: #c0392b; flex-basis: 25%; }
  .b { background: #2980b9; flex-basis: 50%; }
  .c { background: #27ae60; flex-basis: 25%; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>
</body>
</html>
