<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox align-items:center honoring min-height</title>
<style>
  @page { size: 537px 200px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 50px; }
  /* A non-stretch (align-items:center) item still honors its min-height
     (css-flexbox-1 §9.4 step 11). Item .a is floored to 160px and, being
     taller than the 100px container line, overflows it symmetrically; .b and
     .c keep their 60px height. */
  .flex {
    display: flex;
    align-items: center;
    width: 420px;
    height: 100px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box {
    width: 80px;
    height: 60px;
    border: 2px solid #102a43;
  }
  .a { background: #c0392b; min-height: 160px; }
  .b { background: #2980b9; }
  .c { background: #27ae60; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>
</body>
</html>
