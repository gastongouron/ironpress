<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 160px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { font-size: 24px; padding: 24px; }
    .chip { display: inline-flex; width: 120px; height: 42px; gap: 10px; background: #d6dde2; vertical-align: top; }

    .b { background: #2980b9; }
  </style>
</head>
<body><span>L</span><span class="chip"><div class="a"></div><div class="b"></div></span><span>R</span></body>
</html>
