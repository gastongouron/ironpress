<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; width: 160px; border: 2px solid #222222; font-size: 16px; }
    .a { flex: 1 1 0; overflow-wrap: anywhere; background: #c0392b; color: #ffffff; }
    .b { flex: 0 0 50px; height: 70px; background: #2980b9; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="a">LONGWORDLONGWORDLONGWORD</div>
    <div class="b"></div>
  </div>
</body>
</html>
