<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; gap: 12px; width: 220px; border: 2px solid #222222; }
    .item { display: inline; width: 60px; height: 46px; }
    .a { background: #c0392b; }
    .b { background: #2980b9; }
    .c { background: #27ae60; }
  </style>
</head>
<body>
  <div class="flex">
    <span class="item a"></span>
    <span class="item b"></span>
    <span class="item c"></span>
  </div>
</body>
</html>
