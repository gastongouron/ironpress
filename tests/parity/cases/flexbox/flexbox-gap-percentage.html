<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox percentage gap</title>
<style>
  @page { size: 537px 151px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* A percentage gap resolves against the flex container's OWN content-box
     width (CSS Box Alignment §8.3), NOT the parent/ICB width. Here 10% of the
     396px content box = 39.6px gutters between the three items. */
  .flex {
    display: flex;
    gap: 10%;
    width: 400px;
    height: 110px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box {
    width: 80px;
    height: 80px;
    border: 2px solid #102a43;
  }
  .a { background: #c0392b; }
  .b { background: #2980b9; }
  .c { background: #27ae60; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>
</body>
</html>
