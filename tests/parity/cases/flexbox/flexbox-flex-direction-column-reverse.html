<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox flex-direction:column-reverse</title>
<style>
  @page { size: 238px 361px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .flex {
    display: flex;
    flex-direction: column-reverse;
    width: 120px;
    height: 320px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box {
    width: 80px;
    height: 80px;
    border: 2px solid #102a43;
  }
  .a { background: #c0392b; }
  .b { background: #2980b9; }
  .c { background: #27ae60; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>
</body>
</html>
