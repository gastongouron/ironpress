<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; gap: 10px; width: 210px; height: 70px; border: 2px solid #222222; }
    .item { width: 60px; height: 50px; }
    .a { float: right; clear: both; background: #c0392b; }
    .b { background: #2980b9; }
    .c { background: #27ae60; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item a"></div>
    <div class="item b"></div>
    <div class="item c"></div>
  </div>
</body>
</html>
