<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox margin-left:auto split</title>
<style>
  @page { size: 460px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .flex {
    display: flex;
    width: 420px;
    height: 110px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box {
    width: 80px;
    height: 80px;
    border: 2px solid #102a43;
  }
  .a { background: #2980b9; }
  .b { background: #f1c40f; margin-left: auto; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
    </div>
  </div>
</body>
</html>
