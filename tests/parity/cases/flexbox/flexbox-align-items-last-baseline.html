<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 200px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; align-items: last baseline; width: 260px; height: 130px; border: 2px solid #222222; background: #eeeeee; }
    .multi, .one { font-size: 20px; line-height: 1.5; padding: 0 8px; color: #ffffff; }
    .multi { background: #c0392b; }
    .one { background: #2980b9; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="multi">A<br>B</div>
    <div class="one">C</div>
  </div>
</body>
</html>
