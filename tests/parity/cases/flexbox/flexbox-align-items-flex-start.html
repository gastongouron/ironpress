<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox align-items:flex-start</title>
<style>
  @page { size: 478px 201px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* align-items:flex-start anchors differently-tall items to the cross-start
     (top) edge of a tall row container. */
  .flex {
    display: flex;
    align-items: flex-start;
    width: 360px;
    height: 160px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box { width: 90px; border: 2px solid #102a43; }
  .a { background: #c0392b; height: 60px; }
  .b { background: #2980b9; height: 110px; }
  .c { background: #27ae60; height: 80px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>
</body>
</html>
