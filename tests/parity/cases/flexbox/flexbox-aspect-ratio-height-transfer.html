<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; width: 220px; border: 2px solid #222222; }
    .a { flex: 0 1 auto; height: 60px; aspect-ratio: 2 / 1; background: #c0392b; }
    .b { flex: 0 0 40px; height: 60px; background: #2980b9; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
