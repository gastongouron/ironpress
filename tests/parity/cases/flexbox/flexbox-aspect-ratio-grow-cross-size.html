<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 360px 220px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; align-items: flex-start; width: 300px; height: 160px; background: #eeeeee; border: 2px solid #222222; }
    .item { flex: 1 1 0; aspect-ratio: 2 / 1; }
    .a { background: #c0392b; }
    .b { background: #2980b9; }
  </style>
</head>
<body><div class="flex"><div class="item a"></div><div class="item b"></div></div></body>
</html>
