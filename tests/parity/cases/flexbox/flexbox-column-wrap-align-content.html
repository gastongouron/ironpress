<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 340px 220px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; flex-direction: column; flex-wrap: wrap; align-content: space-between; width: 280px; height: 160px; background: #eeeeee; border: 2px solid #222222; }
    .item { width: 60px; height: 70px; background: #2980b9; border: 2px solid #102a43; }
    .item:nth-child(odd) { background: #c0392b; }
  </style>
</head>
<body><div class="flex"><div class="item"></div><div class="item"></div><div class="item"></div><div class="item"></div></div></body>
</html>
