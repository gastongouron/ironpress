<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { position: relative; display: flex; width: 170px; height: 100px; border: 2px solid #222222; }
    .item { order: 1; width: 110px; height: 70px; margin-left: 20px; margin-top: 15px; background: #2980b9; }
    .abs { position: absolute; left: 35px; top: 25px; width: 90px; height: 50px; background: #c0392b; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="abs"></div>
    <div class="item"></div>
  </div>
</body>
</html>
