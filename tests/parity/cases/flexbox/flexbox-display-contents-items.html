<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; gap: 10px; width: 250px; border: 2px solid #222222; }
    .contents { display: contents; }
    .box { width: 60px; height: 50px; }
    .a { background: #c0392b; }
    .b { background: #2980b9; }
    .c { background: #27ae60; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="contents">
      <div class="box a"></div>
      <div class="box b"></div>
    </div>
    <div class="box c"></div>
  </div>
</body>
</html>
