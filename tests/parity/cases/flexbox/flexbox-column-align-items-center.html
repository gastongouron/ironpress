<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; flex-direction: column; align-items: center; width: 180px; height: 130px; border: 2px solid #222222; }
    .item { width: 60px; height: 45px; }
    .a { background: #c0392b; }
    .b { background: #2980b9; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item a"></div>
    <div class="item b"></div>
  </div>
</body>
</html>
