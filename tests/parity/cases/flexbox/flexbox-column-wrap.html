<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox column wrap</title>
<style>
  @page { size: 360px 240px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .flex {
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;
    align-content: flex-start;
    align-items: flex-start;
    row-gap: 10px;
    column-gap: 14px;
    width: 240px;
    height: 150px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box {
    width: 70px;
    height: 60px;
    border: 2px solid #102a43;
  }
  .a { background: #c0392b; }
  .b { background: #2980b9; }
  .c { background: #27ae60; }
  .d { background: #8e44ad; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
      <div class="box d"></div>
    </div>
  </div>
</body>
</html>
