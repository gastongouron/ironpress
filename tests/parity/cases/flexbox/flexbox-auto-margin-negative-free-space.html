<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; width: 120px; border: 2px solid #222222; overflow: visible; }
    .item { flex: 0 0 80px; height: 50px; }
    .a { background: #c0392b; }
    .b { margin-left: auto; background: #2980b9; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item a"></div>
    <div class="item b"></div>
  </div>
</body>
</html>
