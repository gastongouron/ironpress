<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; font-size: 18px; }
    .host { background: #eeeeee; }
    .iflex { display: inline flex; width: 100px; height: 34px; vertical-align: middle; background: #dbeafe; }
    .box { display: block; width: 45px; height: 30px; }
    .a { background: #c0392b; }
    .b { background: #2980b9; }
  </style>
</head>
<body>
  <p class="host">L <span class="iflex"><span class="box a"></span><span class="box b"></span></span> R</p>
</body>
</html>
