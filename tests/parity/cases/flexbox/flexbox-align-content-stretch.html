<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox align-content:stretch</title>
<style>
  @page { size: 337px 361px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* align-content:stretch (the default) grows the flex LINES to fill the extra
     cross-axis space. Items have auto height so each line stretches to half the
     container's inner height. */
  .flex {
    display: flex;
    flex-wrap: wrap;
    align-content: stretch;
    align-items: stretch;
    width: 220px;
    height: 320px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box {
    width: 90px;
    border: 2px solid #102a43;
  }
  .a { background: #c0392b; }
  .b { background: #2980b9; }
  .c { background: #27ae60; }
  .d { background: #f39c12; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
      <div class="box d"></div>
    </div>
  </div>
</body>
</html>
