<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox align-self:center</title>
<style>
  @page { size: 478px 221px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* Container default align-items:flex-start; the middle item overrides with
     align-self:center, the third with align-self:flex-end. */
  .flex {
    display: flex;
    align-items: flex-start;
    width: 360px;
    height: 180px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box { width: 90px; height: 70px; border: 2px solid #102a43; }
  .a { background: #c0392b; }
  .b { background: #2980b9; align-self: center; }
  .c { background: #27ae60; align-self: flex-end; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>
</body>
</html>
