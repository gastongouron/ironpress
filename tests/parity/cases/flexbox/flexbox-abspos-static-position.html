<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { position: relative; display: flex; justify-content: center; align-items: flex-start; width: 260px; height: 120px; background: #eeeeee; border: 2px solid #222222; }
    .abs { position: absolute; align-self: flex-end; width: 70px; height: 40px; background: #c0392b; }
  </style>
</head>
<body><div class="flex"><div class="abs"></div></div></body>
</html>
