<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flexbox flex-basis:auto</title>
<style>
  @page { size: 518px 151px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  /* flex-basis:auto resolves to each item's declared width (no grow/shrink),
     so items keep their distinct widths 60/160/100. */
  .flex {
    display: flex;
    width: 400px;
    height: 110px;
    border: 2px solid #222222;
    background: #eeeeee;
  }
  .box { height: 80px; border: 2px solid #102a43; flex: 0 0 auto; }
  .a { background: #c0392b; width: 60px; }
  .b { background: #2980b9; width: 160px; }
  .c { background: #27ae60; width: 100px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="flex">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>
</body>
</html>
