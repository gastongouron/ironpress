<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 300px 150px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; justify-content: safe center; width: 150px; height: 70px; background: #eeeeee; border: 2px solid #222222; overflow: visible; }
    .box { flex: 0 0 auto; width: 90px; height: 66px; }
    .a { background: #c0392b; }
    .b { background: #2980b9; }
  </style>
</head>
<body><div class="flex"><div class="box a"></div><div class="box b"></div></div></body>
</html>
