<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 340px 160px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; align-items: baseline; width: 280px; height: 120px; background: #eeeeee; border: 2px solid #222222; }
    .text { font-size: 64px; line-height: 64px; background: #c0392b; color: #ffffff; padding: 0 6px; }
    .empty { width: 70px; height: 32px; background: #2980b9; margin-left: 12px; }
  </style>
</head>
<body><div class="flex"><div class="text">Aa</div><div class="empty"></div></div></body>
</html>
