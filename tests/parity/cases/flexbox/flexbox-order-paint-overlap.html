<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; width: 160px; height: 80px; border: 2px solid #222222; }
    .a { order: 2; position: relative; left: -40px; width: 80px; height: 60px; background: #27ae60; }
    .b { order: 1; width: 80px; height: 60px; background: #c0392b; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
