<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 280px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; flex-wrap: wrap; align-content: flex-start; row-gap: 10%; column-gap: 10px; width: 134px; height: 204px; border: 2px solid #222222; }
    .item { width: 60px; height: 40px; }
    .a { background: #c0392b; }
    .b { background: #2980b9; }
    .c { background: #27ae60; }
    .d { background: #f59e0b; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="item a"></div>
    <div class="item b"></div>
    <div class="item c"></div>
    <div class="item d"></div>
  </div>
</body>
</html>
