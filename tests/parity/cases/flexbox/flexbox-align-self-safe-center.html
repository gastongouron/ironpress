<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; align-items: flex-start; width: 180px; height: 110px; border: 2px solid #222222; }
    .a, .b { width: 60px; height: 40px; }
    .a { background: #c0392b; }
    .b { align-self: safe center; background: #2980b9; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="a"></div>
    <div class="b"></div>
  </div>
</body>
</html>
