<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 320px 180px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; flex-direction: column; width: 170px; height: 80px; border: 2px solid #222222; overflow: visible; }
    .a { flex: 1 1 auto; background: #c0392b; color: #ffffff; font-size: 18px; }
    .b { flex: 0 0 20px; background: #2980b9; }
  </style>
</head>
<body>
  <div class="flex">
    <div class="a">line one<br>line two<br>line three</div>
    <div class="b"></div>
  </div>
</body>
</html>
