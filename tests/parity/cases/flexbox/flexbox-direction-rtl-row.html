<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @page { size: 360px 150px; margin: 0; }
    html { font-family: ParitySans; line-height: 1.5; }
    * { margin: 0; box-sizing: border-box; }
    body { padding: 20px; }
    .flex { display: flex; direction: rtl; width: 300px; height: 80px; background: #eeeeee; border: 2px solid #222222; }
    .box { width: 70px; height: 76px; }
    .a { background: #c0392b; }
    .b { background: #2980b9; }
    .c { background: #27ae60; }
  </style>
</head>
<body><div class="flex"><div class="box a"></div><div class="box b"></div><div class="box c"></div></div></body>
</html>
