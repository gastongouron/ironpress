<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  /* background is non-inherited, so `background: unset` behaves like initial
     (transparent), revealing the green .wrap behind the box. */
  .wrap { background: #2e9e4f; }
  .box { background: unset; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box"></div>
  </div>
</body>
</html>
