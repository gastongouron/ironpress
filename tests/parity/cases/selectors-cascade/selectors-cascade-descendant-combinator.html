<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  /* Descendant combinator: every .box anywhere inside #parent turns green,
     including the deeply nested one. The .box outside #parent stays gray. */
  #parent .box { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="parent">
      <div class="box"></div>
      <div style="padding-left:20px">
        <div class="box"></div>
      </div>
    </div>
    <div class="box"></div>
  </div>
</body>
</html>
