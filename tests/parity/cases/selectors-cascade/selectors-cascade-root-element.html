<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  /* :root targets the html element; it must paint the page background green.
     A centered white box sits on top so the green frame is clearly visible. */
  :root { background: #2e9e4f; }
  .panel {
    width: 200px;
    height: 200px;
    margin: 40px;
    background: #ffffff;
    border: 2px solid #11324f;
  }
</style>
</head>
<body>
  <div class="panel"></div>
</body>
</html>
