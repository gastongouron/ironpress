<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  /* Direct-child combinator: only .box that is an immediate child of
     #parent turns green. The nested .box inside .mid must stay gray. */
  #parent > .box { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="parent">
      <div class="box"></div>
      <div class="mid" style="padding-left:20px">
        <div class="box"></div>
      </div>
      <div class="box"></div>
    </div>
  </div>
</body>
</html>
