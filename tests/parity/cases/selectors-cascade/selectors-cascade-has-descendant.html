<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 180px 110px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .card {
    width: 120px;
    height: 70px;
    background: #c62828;
  }
  .card:has(.flag) { background: #0a7f2e; }
</style>
</head>
<body>
  <div class="card"><div><span class="flag"></span></div></div>
</body>
</html>
