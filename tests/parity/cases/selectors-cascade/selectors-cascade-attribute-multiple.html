<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  /* [data-a="1"][data-b="2"]: both attributes must match on the same box. */
  .box[data-a="1"][data-b="2"] { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box" data-a="1" data-b="9"></div>
    <div class="box" data-a="1" data-b="2"></div>
    <div class="box" data-a="0" data-b="2"></div>
  </div>
</body>
</html>
