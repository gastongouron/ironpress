<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  /* :is(.a, .c) green: matches any box carrying class a OR c. */
  .box:is(.a, .c) { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box c"></div>
  </div>
</body>
</html>
