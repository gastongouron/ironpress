<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  .wrap { background: #2e9e4f; }
  /* color is an inherited property; the child swatch text inherits the parent
     green color. We verify via a filled green box that the inherited background
     of .wrap flows visually behind the transparent inner box. */
  .box { background: transparent; border-color: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box"></div>
  </div>
</body>
</html>
