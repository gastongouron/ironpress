<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  /* [lang|="en"] hyphen match: value is en or begins with en-. */
  .box[lang|="en"] { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box" lang="en"></div>
    <div class="box" lang="english"></div>
    <div class="box" lang="en-US"></div>
  </div>
</body>
</html>
