<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 217px 255px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  /* [data-id*="mid"] substring match: any box whose value contains mid turns green. */
  .box[data-id*="mid"] { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box" data-id="xmidx"></div>
    <div class="box" data-id="nope"></div>
    <div class="box" data-id="mid"></div>
  </div>
</body>
</html>
