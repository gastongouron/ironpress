<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .row { padding: 20px; }
  /* type selector div sets gray; class .pick (higher specificity) sets green
     on only the second box even though it is declared earlier. */
  .pick { background: #2e9e4f; }
  div.box {
    width: 100px;
    height: 100px;
    border: 2px solid #11324f;
    display: inline-block;
    background: #bdbdbd;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="box" style="display:inline-block"></div><div class="box pick" style="display:inline-block"></div><div class="box" style="display:inline-block"></div>
  </div>
</body>
</html>
