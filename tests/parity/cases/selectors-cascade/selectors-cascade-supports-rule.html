<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 160px;
    height: 120px;
    border: 2px solid #11324f;
    background: #bdbdbd;
  }
  /* @supports for a universally-supported declaration: the box should turn green.
     Engines that do not parse @supports drop the rule and leave the box gray. */
  @supports (display: block) {
    .box { background: #2e9e4f; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box"></div>
  </div>
</body>
</html>
