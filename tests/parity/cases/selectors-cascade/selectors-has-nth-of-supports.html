<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 240px 190px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body { padding: 20px; }
  .card,
  .item {
    width: 70px;
    height: 28px;
    background: #c62828;
    margin-bottom: 8px;
  }
  .flag { display: none; }
  @supports selector(.card:has(> .flag)) {
    .card:has(> .flag) { background: #0a7f2e; }
  }
  .deck .item {
    display: inline-block;
    margin-right: 6px;
    background: #bdbdbd;
  }
  .deck .item:nth-child(2 of .flagged) { background: #0a7f2e; }
</style>
</head>
<body>
  <div class="card"><span class="flag"></span></div>
  <div class="deck">
    <div class="item flagged"></div>
    <div class="item"></div>
    <div class="item flagged"></div>
  </div>
</body>
</html>
