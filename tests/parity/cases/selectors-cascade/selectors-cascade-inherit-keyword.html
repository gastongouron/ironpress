<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  .wrap { background: #2e9e4f; }
  /* background is NOT inherited by default; `background: inherit` forces the
     box to copy the parent .wrap green explicitly. */
  .box { background: inherit; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box"></div>
  </div>
</body>
</html>
