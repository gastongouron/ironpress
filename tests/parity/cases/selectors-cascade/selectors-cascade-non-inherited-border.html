<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 817px 165px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  /* border is NOT inherited: the parent's thick border does not flow to the
     child box, which keeps its own 2px border. The child is filled green to
     make its (un-inherited) geometry unambiguous. */
  .outer { border: 10px solid #11324f; padding: 10px; margin-bottom: 10px; }
  .box { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="outer"><div class="box"></div></div>
  </div>
</body>
</html>
