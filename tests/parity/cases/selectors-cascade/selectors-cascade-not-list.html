<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 217px 255px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  /* :not(.a, .b) green: every box except those carrying class a OR b. */
  .box:not(.a, .b) { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box"></div>
  </div>
</body>
</html>
