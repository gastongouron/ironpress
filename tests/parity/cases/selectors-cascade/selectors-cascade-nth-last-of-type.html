<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @page { size: 170px 120px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  p,
  div.row {
    width: 120px;
    height: 24px;
    background: #c62828;
  }
  p:nth-last-of-type(2) { background: #0a7f2e; }
</style>
</head>
<body>
  <p></p>
  <div class="row"></div>
  <p></p>
  <p></p>
</body>
</html>
