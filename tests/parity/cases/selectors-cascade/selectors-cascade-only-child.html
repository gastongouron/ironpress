<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 817px 324px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .wrap { padding: 20px; }
  .box {
    width: 100px;
    height: 60px;
    border: 2px solid #11324f;
    background: #bdbdbd;
    margin-bottom: 10px;
  }
  .panel { padding: 10px; margin-bottom: 10px; border: 2px solid #888; }
  /* :only-child: the box turns green ONLY when it is the sole child of its panel. */
  .box:only-child { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel"><div class="box"></div></div>
    <div class="panel"><div class="box"></div><div class="box"></div></div>
  </div>
</body>
</html>
