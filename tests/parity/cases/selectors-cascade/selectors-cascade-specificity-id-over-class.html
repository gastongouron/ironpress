<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 518px 150px; margin: 0; }
  html { font-family: ParitySans; line-height: 1.5; }
  * { margin: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  .row { padding: 20px; }
  /* All four are .box (class). Only the second also has id #pick.
     #pick (specificity 1,0,0) must beat .box.tint (0,2,0). */
  .box {
    width: 100px;
    height: 100px;
    border: 2px solid #11324f;
    display: inline-block;
    background: #bdbdbd;
  }
  .box.tint { background: #bdbdbd; }
  #pick { background: #2e9e4f; }
</style>
</head>
<body>
  <div class="row">
    <span class="box tint"></span><span class="box tint" id="pick"></span><span class="box tint"></span><span class="box tint"></span>
  </div>
</body>
</html>
