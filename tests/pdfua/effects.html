<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Effects</title>
  <style>
    body { font-family: sans-serif; font-size: 11pt; }
    .card { opacity: 0.6; padding: 6pt; background: #eef; }
    .blend { mix-blend-mode: multiply; }
  </style>
</head>
<body>
  <h1>Effects</h1>
  <div class="card">
    <h2>Faded section</h2>
    <p>Inside the card, <a href="https://example.com/card">a link</a> and text.</p>
    <ul><li>one</li><li>two</li></ul>
  </div>
  <p class="blend">Blended paragraph with a combining mark: x&#x301; and a ligature: office.</p>
</body>
</html>
