[package]
name = "ironpress-ffi"
version = "1.7.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Stable C ABI for the Ironpress HTML-to-PDF engine"
license = "MIT"
repository = "https://github.com/gastongouron/ironpress"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ironpress-core = { version = "=1.7.0", path = "../..", package = "ironpress" }
