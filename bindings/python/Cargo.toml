[package]
name = "ironpress-python"
version = "1.7.0"
edition = "2024"
publish = false
description = "Python bindings for the Ironpress HTML-to-PDF engine"
license = "MIT"
repository = "https://github.com/gastongouron/ironpress"

[lib]
name = "ironpress_python"
crate-type = ["cdylib"]

[dependencies]
ironpress-core = { version = "=1.7.0", path = "../..", package = "ironpress" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
