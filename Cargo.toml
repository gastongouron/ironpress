[package]
name = "ironpress"
version = "1.6.0"
edition = "2024"
rust-version = "1.88"
description = "Pure Rust HTML/CSS/Markdown to PDF converter with layout engine, LaTeX math, tables, images, custom fonts, and streaming output. No browser, no system dependencies."
license = "MIT"
repository = "https://github.com/gastongouron/ironpress"
documentation = "https://docs.rs/ironpress"
readme = "README.md"
keywords = ["pdf", "html", "css", "markdown", "converter"]
categories = ["text-processing", "encoding", "template-engine"]
exclude = [
    ".github/",
    ".claude/",
    "target/",
    "docs/",
    "bindings/",
    "font-packs/",
    "dist/",
    "tests/parity/",
    "scripts/",
]

[workspace]
resolver = "3"
members = ["bindings/c", "bindings/python", "bindings/ruby/ext/ironpress"]

[patch.crates-io]
ironpress = { path = "." }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ironpress"
path = "src/bin/cli.rs"

[features]
default = []
async = ["tokio"]
remote = ["bogon", "core-net", "ureq", "url"]
wasm = ["wasm-bindgen", "js-sys", "getrandom/wasm_js"]

[dependencies]
cssparser-color = "0.1"
cssparser = "0.33"
html5ever = "0.39"
lightningcss = { version = "=1.0.0-alpha.71", default-features = false }
# lightningcss alpha.71 declares `parcel_selectors = "0.28.2"`, which also
# admits 0.28.3 even though that release moved to an incompatible cssparser.
# Keep the transitive selector API on the version alpha.71 was built against.
parcel_selectors = "=0.28.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png_decoder = { package = "png", version = "0.18" }
pulldown-cmark = "0.13"
markup5ever_rcdom = "0.39"
fontdb = "0.23"
flate2 = "1"
lru = "0.18"
resvg = "0.47"
rustybuzz = "0.20"
self_cell = "1"
sha2 = "0.10"
skrifa = "=0.42.1"
subsetter = "=0.2.6"
thiserror = "2"
tokio = { version = "1.23.1", features = ["fs", "rt"], optional = true }
bogon = { version = "0.3", optional = true }
core-net = { version = "0.1", optional = true }
# The custom resolver lives in ureq's `unversioned` API. Pin the exact release
# so a compatible-looking minor update cannot change that private contract.
ureq = { version = "=3.3.0", optional = true }
url = { version = "2.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
language-tags = "0.3.2"
# lightningcss alpha.71 still uses getrandom 0.3 on wasm32. This direct edge
# enables wasm_js for that shared dependency graph; 0.4 would leave 0.3 unconfigured.
getrandom = { version = "0.3", optional = true }
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.2"

[dev-dependencies]
tokio = { version = "1.23.1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"
# Visual parity harness (tests/feature_parity.rs) deps.
serde = { version = "1", features = ["derive"] }
rayon = "1"
fs2 = "0.4.3"
tempfile = "3"

[[bench]]
name = "conversion"
harness = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
